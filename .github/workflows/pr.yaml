name: pr

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.27.1"
          check-latest: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: Run Go tests
        run: go test ./...

      # A tool that reports other people's vulnerabilities should be held to the
      # same standard. Both of these fail the build rather than warning.
      - name: Vulnerability check (our own modules)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The status page is plain ES modules served from the binary, so there is nothing to
  # build — but "it parses" is not a standard. Type-checking catches what actually
  # shipped broken: a duplicate object key that silently overrode a column's hover
  # text, and a CSS class used before it existed.
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check the page
        run: npm run check
      - name: Run page tests
        run: npm test

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/patchwright --set provider.input.secretName=ci --set image.tag=v0.0.0-ci
      - run: helm lint deploy/helm/patchwright-rbac --set subject.name=3f2a9c1e-7b44-4d0e-9a11-8c6b2e5f0d33
      # Lint parses; it does not prove the templates render. These do, and they assert
      # the guards that exist to stop a broken grant reaching a cluster.
      - name: Render the charts
        shell: bash
        run: |
          set -euo pipefail
          # An explicit tag, because the committed chart is a development copy and
          # deliberately refuses to default to an image that does not exist.
          helm template deploy/helm/patchwright \
            --set provider.input.secretName=ci --set image.tag=v0.0.0-ci > /dev/null

          # And that refusal is itself worth asserting: it is what stops somebody
          # installing from a checkout and getting ImagePullBackOff with no explanation.
          if helm template deploy/helm/patchwright --set provider.input.secretName=ci > /dev/null 2>&1; then
            echo 'the development chart rendered without an image tag, and must not have' >&2
            exit 1
          fi

          rbac=deploy/helm/patchwright-rbac
          helm template "$rbac" --set subject.name=3f2a9c1e-7b44-4d0e-9a11-8c6b2e5f0d33 > /dev/null

          # Each of these must FAIL to render. The bare OBJECT_ID is the one that
          # shipped: envsubst leaves a name with no dollar sign untouched, and the
          # binding it produced authenticated a user called "OBJECT_ID" in every
          # cluster while replacing the one that worked.
          for bad in '' '${OBJECT_ID}' 'OBJECT_ID' '<object-id>' 'changeme'; do
            if helm template "$rbac" --set "subject.name=$bad" > /dev/null 2>&1; then
              echo "subject.name='$bad' rendered, and must not have" >&2
              exit 1
            fi
          done
          if helm template "$rbac" --set subject.name=abc \
              --set 'rbac.customResourceGroups={*}' > /dev/null 2>&1; then
            echo 'a wildcard API group rendered, and must not have' >&2
            exit 1
          fi

  integration:
    name: integration-kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.27.1"
          check-latest: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@latest
      # ubuntu-latest runners have docker and kubectl preinstalled.
      - name: Run integration suite (kind)
        run: make test-integration

  build:
    name: build-image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Scan our own image on the same terms we report on everyone else's. Fails on
      # a fixable CRITICAL or HIGH: shipping a vulnerability scanner with a fixable
      # critical in it would be difficult to defend. Built again for amd64 only,
      # because a multi-platform build stays in the cache with nothing loadable for
      # the scanner to read.
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: patchwright:scan
      # Two steps on purpose, because "our vulnerabilities" and "our dependency's
      # vulnerabilities" are different problems with different remedies.
      #
      # The gate covers the base image and our own binary, which we can fix by
      # bumping a module or a base tag. It fails the build.
      #
      # Retried once, because the step's first act is to fetch the vulnerability
      # DB from a public registry and that fetch is observably flaky: it has
      # failed here in one second, far too fast to have scanned anything, on a
      # commit touching no build input whose predecessor passed twenty seconds
      # earlier. Retrying costs nothing in correctness — a real fixable CRITICAL
      # fails both attempts — and the alternative is a gate people learn to
      # re-run on reflex, which is a gate nobody reads.
      #
      # The DB repository is pinned to upstream first: the default list leads
      # with a mirror that has served 404s for layers it had just advertised.
      - name: Scan our own image (gate)
        id: gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-files: usr/local/bin/trivy

      - name: Scan our own image (gate, retry)
        if: steps.gate.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-files: usr/local/bin/trivy

      # The bundled Trivy binary is reported but does not gate. Its dependencies are
      # not ours to patch: at the time of writing v0.73.0 is the latest release and
      # carries two fixable HIGHs (go-git CVE-2026-71556, oras-go CVE-2026-50163),
      # so gating on it would block every pull request until upstream ships a fix,
      # and lowering the gate to CRITICAL-only to get green would hide our own
      # problems too. Renovate bumps this image, and the report keeps it visible
      # rather than accepted.
      - name: Scan the bundled scanner (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
