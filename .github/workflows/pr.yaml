name: pr

on:
  pull_request:
  workflow_dispatch:

# Every job starts at once. The kind suite and the image build used to wait for the
# unit tests, which serialised the two slowest jobs behind the fastest and bought
# nothing: a failing unit test fails the PR whether or not the image built.
jobs:
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.27.1"
          check-latest: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: Run Go tests
        run: go test ./...

      # A tool that reports other people's vulnerabilities should be held to the
      # same standard. Both of these fail the build rather than warning.
      - name: Vulnerability check (our own modules)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The status page is plain ES modules served from the binary, so there is nothing to
  # build — but "it parses" is not a standard. Type-checking catches what actually
  # shipped broken: a duplicate object key that silently overrode a column's hover
  # text, and a CSS class used before it existed.
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type-check the page
        run: npm run check
      - name: Run page tests
        run: npm test
      - name: Install a browser for the page tests
        run: npx playwright install --with-deps chromium
      - name: Run the page in a browser
        run: npm run test:ui

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/patchwright --set provider.input.secretName=ci --set image.tag=v0.0.0-ci
      - run: helm lint deploy/helm/patchwright-rbac --set subject.name=3f2a9c1e-7b44-4d0e-9a11-8c6b2e5f0d33
      # Lint parses; it does not prove the templates render. These do, and they assert
      # the guards that exist to stop a broken grant reaching a cluster.
      - name: Render the charts
        shell: bash
        run: |
          set -euo pipefail
          # An explicit tag, because the committed chart is a development copy and
          # deliberately refuses to default to an image that does not exist.
          helm template deploy/helm/patchwright \
            --set provider.input.secretName=ci --set image.tag=v0.0.0-ci > /dev/null

          # And that refusal is itself worth asserting: it is what stops somebody
          # installing from a checkout and getting ImagePullBackOff with no explanation.
          if helm template deploy/helm/patchwright --set provider.input.secretName=ci > /dev/null 2>&1; then
            echo 'the development chart rendered without an image tag, and must not have' >&2
            exit 1
          fi

          rbac=deploy/helm/patchwright-rbac
          helm template "$rbac" --set subject.name=3f2a9c1e-7b44-4d0e-9a11-8c6b2e5f0d33 > /dev/null

          # Each of these must FAIL to render. The bare OBJECT_ID is the one that
          # shipped: envsubst leaves a name with no dollar sign untouched, and the
          # binding it produced authenticated a user called "OBJECT_ID" in every
          # cluster while replacing the one that worked.
          for bad in '' '${OBJECT_ID}' 'OBJECT_ID' '<object-id>' 'changeme'; do
            if helm template "$rbac" --set "subject.name=$bad" > /dev/null 2>&1; then
              echo "subject.name='$bad' rendered, and must not have" >&2
              exit 1
            fi
          done
          if helm template "$rbac" --set subject.name=abc \
              --set 'rbac.customResourceGroups={*}' > /dev/null 2>&1; then
            echo 'a wildcard API group rendered, and must not have' >&2
            exit 1
          fi
          if helm template deploy/helm/patchwright --set provider.input.secretName=ci \
              --set image.tag=v0.0.0-ci --set 'rbac.customResourceGroups={*}' > /dev/null 2>&1; then
            echo 'a wildcard API group rendered in the main chart, and must not have' >&2
            exit 1
          fi

          # The split server: a worker and web replicas over the history database.
          main=(deploy/helm/patchwright --set provider.input.secretName=ci --set image.tag=v0.0.0-ci)
          history=(--set history.enabled=true --set history.retention=400d --set history.connection.host=db)
          helm lint "${main[@]}" "${history[@]}" --set split.enabled=true
          split=$(helm template pw "${main[@]}" "${history[@]}" --set split.enabled=true \
            --set scan.enabled=true --set scan.cache.persistence.enabled=true --set metrics.serviceMonitor.enabled=true)
          for want in 'name: pw-patchwright-worker' 'name: pw-patchwright-web' 'kind: PodDisruptionBudget' \
              '"--role=worker"' '"--role=web"' 'automountServiceAccountToken: false' 'type: Recreate'; do
            if ! grep -qF -- "$want" <<<"$split"; then
              echo "the split render is missing: $want" >&2
              exit 1
            fi
          done
          # Only the worker mounts the ReadWriteOnce cache and is bound to the cluster-read
          # role; the web replicas would otherwise fight over the volume across nodes.
          if [ "$(grep -c 'claimName: pw-patchwright-trivy-cache' <<<"$split")" != 1 ]; then
            echo 'the Trivy cache volume is mounted by more than the worker' >&2
            exit 1
          fi
          # doc prints the rendered object of one kind and name, so a check can look at the
          # web replicas alone rather than grep a render that also holds the worker.
          doc() {
            python3 -c 'import sys, yaml
          for d in yaml.safe_load_all(sys.stdin):
              if d and d["kind"] == sys.argv[1] and d["metadata"]["name"] == sys.argv[2]:
                  print(yaml.safe_dump(d))' "$1" "$2"
          }

          # The top-level extraArgs are the worker's: a web replica refuses --auto-ticket,
          # and passing it there would crash-loop every one of them.
          split=$(helm template pw "${main[@]}" "${history[@]}" --set split.enabled=true \
            --set 'extraArgs={--auto-ticket}' --set 'split.web.extraArgs={--web-flag}')
          web=$(doc Deployment pw-patchwright-web <<<"$split")
          worker=$(doc Deployment pw-patchwright-worker <<<"$split")
          if grep -qF -- '--auto-ticket' <<<"$web" || ! grep -qF -- '--web-flag' <<<"$web" \
              || ! grep -qF -- '--auto-ticket' <<<"$worker" || grep -qF -- '--web-flag' <<<"$worker"; then
            echo 'extraArgs and split.web.extraArgs did not reach the worker and the web replicas respectively' >&2
            exit 1
          fi

          # The disruption budget bounds how many web replicas go at once; a minimum would
          # block every drain of a single replica.
          pdb=$(helm template pw "${main[@]}" "${history[@]}" --set split.enabled=true --set split.web.replicas=1 \
            | doc PodDisruptionBudget pw-patchwright-web)
          if ! grep -qF 'maxUnavailable: 1' <<<"$pdb" || grep -qF 'minAvailable' <<<"$pdb"; then
            echo 'the web PodDisruptionBudget is not maxUnavailable 1' >&2
            exit 1
          fi

          # And with it off, nothing of it renders: the single Deployment stays the default.
          if helm template pw "${main[@]}" "${history[@]}" | grep -qE -- '--role=|component: (worker|web)'; then
            echo 'split resources rendered with split.enabled false' >&2
            exit 1
          fi

          # Each of these must FAIL to render: a split with nothing to share, with no
          # server to split, with no web replica, or with sign-in and no shared key.
          if helm template "${main[@]}" --set split.enabled=true > /dev/null 2>&1; then
            echo 'split.enabled rendered without history, and must not have' >&2
            exit 1
          fi
          if helm template "${main[@]}" "${history[@]}" --set split.enabled=true --set server.enabled=false > /dev/null 2>&1; then
            echo 'split.enabled rendered without the server, and must not have' >&2
            exit 1
          fi
          if helm template "${main[@]}" "${history[@]}" --set split.enabled=true --set split.web.replicas=0 > /dev/null 2>&1; then
            echo 'split.enabled rendered with no web replicas, and must not have' >&2
            exit 1
          fi
          if helm template "${main[@]}" "${history[@]}" --set split.enabled=true --set auth.oidc.issuer=https://idp \
              --set auth.oidc.clientID=c --set auth.oidc.redirectURL=https://x/cb > /dev/null 2>&1; then
            echo 'split.enabled with sign-in rendered without a session key source, and must not have' >&2
            exit 1
          fi

  integration:
    name: integration-kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.27.1"
          check-latest: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@latest
      # ubuntu-latest runners have docker and kubectl preinstalled.
      - name: Run integration suite (kind)
        run: make test-integration

  build:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Scan our own image on the same terms we report on everyone else's. Fails on
      # a fixable CRITICAL or HIGH: shipping a vulnerability scanner with a fixable
      # critical in it would be difficult to defend. Built again for amd64 only,
      # because a multi-platform build stays in the cache with nothing loadable for
      # the scanner to read.
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: patchwright:scan
      # Two steps on purpose, because "our vulnerabilities" and "our dependency's
      # vulnerabilities" are different problems with different remedies.
      #
      # The gate covers the base image and our own binary, which we can fix by
      # bumping a module or a base tag. It fails the build.
      #
      # Retried once, because the step's first act is to fetch the vulnerability
      # DB from a public registry and that fetch is observably flaky: it has
      # failed here in one second, far too fast to have scanned anything, on a
      # commit touching no build input whose predecessor passed twenty seconds
      # earlier. Retrying costs nothing in correctness — a real fixable CRITICAL
      # fails both attempts — and the alternative is a gate people learn to
      # re-run on reflex, which is a gate nobody reads.
      #
      # The DB repository is pinned to upstream first: the default list leads
      # with a mirror that has served 404s for layers it had just advertised.
      - name: Scan our own image (gate)
        id: gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-files: usr/local/bin/trivy

      - name: Scan our own image (gate, retry)
        if: steps.gate.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-files: usr/local/bin/trivy

      # The bundled Trivy binary is reported but does not gate. Its dependencies are
      # not ours to patch: at the time of writing v0.73.0 is the latest release and
      # carries two fixable HIGHs (go-git CVE-2026-71556, oras-go CVE-2026-50163),
      # so gating on it would block every pull request until upstream ships a fix,
      # and lowering the gate to CRITICAL-only to get green would hide our own
      # problems too. Renovate bumps this image, and the report keeps it visible
      # rather than accepted.
      - name: Scan the bundled scanner (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
