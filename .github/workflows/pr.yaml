name: pr

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.26.5"
          check-latest: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      - name: Run Go tests
        run: go test ./...

      # A tool that reports other people's vulnerabilities should be held to the
      # same standard. Both of these fail the build rather than warning.
      - name: Vulnerability check (our own modules)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/patchwright --set provider.input.secretName=ci

  integration:
    name: integration-kind
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Matches the toolchain pinned in go.mod, which carries stdlib CVE fixes.
          # check-latest stays on so a newer patch is picked up rather than pinned out.
          go-version: "1.26.5"
          check-latest: true
      - name: Install kind
        run: go install sigs.k8s.io/kind@latest
      # ubuntu-latest runners have docker and kubectl preinstalled.
      - name: Run integration suite (kind)
        run: make test-integration

  build:
    name: build-image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # Scan our own image on the same terms we report on everyone else's. Fails on
      # a fixable CRITICAL or HIGH: shipping a vulnerability scanner with a fixable
      # critical in it would be difficult to defend. Built again for amd64 only,
      # because a multi-platform build stays in the cache with nothing loadable for
      # the scanner to read.
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: patchwright:scan
      # Two steps on purpose, because "our vulnerabilities" and "our dependency's
      # vulnerabilities" are different problems with different remedies.
      #
      # The gate covers the base image and our own binary, which we can fix by
      # bumping a module or a base tag. It fails the build.
      - name: Scan our own image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-files: usr/local/bin/trivy

      # The bundled Trivy binary is reported but does not gate. Its dependencies are
      # not ours to patch: at the time of writing v0.73.0 is the latest release and
      # carries two fixable HIGHs (go-git CVE-2026-71556, oras-go CVE-2026-50163),
      # so gating on it would block every pull request until upstream ships a fix,
      # and lowering the gate to CRITICAL-only to get green would hide our own
      # problems too. Renovate bumps this image, and the report keeps it visible
      # rather than accepted.
      - name: Scan the bundled scanner (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patchwright:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
