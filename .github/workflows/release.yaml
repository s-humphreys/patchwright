name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: build-push-image
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      # Keyless signing exchanges this for a short-lived certificate bound to the
      # workflow's identity. No signing key exists to be stolen.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare semantic-release config
        run: |
          cat <<EOF > .releaserc.json
          {
            "branches": [
              "${RELEASE_BRANCH}"
            ],
            "plugins": [
              [
                "@semantic-release/commit-analyzer",
                {
                  "releaseRules": [
                    {"breaking": true, "release": "major"},
                    {"type": "feat", "release": "minor"},
                    {"type": "fix", "release": "patch"},
                    {"type": "chore", "release": "patch"}
                  ]
                }
              ],
              [
                "@semantic-release/release-notes-generator",
                {
                  "preset": "conventionalcommits"
                }
              ],
              [
                "@semantic-release/github",
                {
                  "addReleases": "bottom"
                }
              ]
            ]
          }
          EOF
        env:
          RELEASE_BRANCH: main

      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@9.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release body with GitHub auto notes
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n 1 || true)

          payload=$(jq -n --arg tag "${NEW_TAG}" --arg prev "${PREV_TAG}" '
            {tag_name: $tag} + (if $prev | length > 0 then {previous_tag_name: $prev} else {} end)
          ')

          response=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPOSITORY}/releases/generate-notes \
            -d "${payload}")

          body=$(echo "${response}" | jq -r '.body')
          if [ -z "${body}" ] || [ "${body}" = "null" ]; then
            echo "GitHub did not return generated notes. API response:" >&2
            echo "${response}" >&2
            exit 1
          fi

          release_response=$(curl -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPOSITORY}/releases/tags/${NEW_TAG})

          release_id=$(echo "${release_response}" | jq -r '.id')
          if [ -z "${release_id}" ] || [ "${release_id}" = "null" ]; then
            echo "Unable to find release ID for tag ${NEW_TAG}. API response:" >&2
            echo "${release_response}" >&2
            exit 1
          fi

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPOSITORY}/releases/${release_id} \
            -d "$(jq -n --arg body "${body}" '{body: $body}')"

      - name: Determine image tags
        id: meta
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.semantic.outputs.new_release_version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.semantic.outputs.new_release_version }}
            type=semver,pattern=v{{major}},value=${{ steps.semantic.outputs.new_release_version }}

      - name: Build and push image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Stamped into the binary so the running deployment can say which build it
          # is, rather than everyone inferring it from the image tag they think is
          # deployed.
          build-args: |
            VERSION=v${{ steps.semantic.outputs.new_release_version }}
          # Publish an SBOM and build provenance with the image. A security review
          # asks what is in the artefact; this answers it from the build rather than
          # from a claim in a document.
          sbom: true
          provenance: mode=max

      # The charts ship as OCI artefacts beside the image, versioned with it.
      #
      # They used to be consumed from git: a Flux GitRepository pinned to a tag, with an
      # ignore filter to strip everything that is not the chart. That left three
      # workarounds in the deployment. The chart's own version never moved, so Flux
      # reused a cached artefact and installed the OLD chart when the tag advanced; its
      # appVersion never tracked the release, so the image tag had to be pinned by hand
      # in values; and a git tag is mutable in a way a digest is not.
      #
      # Stamping version and appVersion from the release removes all three: the chart
      # version IS the app version, so there is nothing to pin and nothing to go stale.
      - name: Set up Helm
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: azure/setup-helm@v5

      - name: Package and push the charts
        if: steps.semantic.outputs.new_release_published == 'true'
        id: charts
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

          mkdir -p dist
          digests=""
          for chart in patchwright patchwright-rbac; do
            # --version and --app-version rather than editing Chart.yaml: the committed
            # values stay 0.0.0-dev, so a chart installed from a checkout can never be
            # mistaken for a released one.
            helm package "deploy/helm/${chart}" \
              --version "${VERSION}" --app-version "v${VERSION}" -d dist
            out=$(helm push "dist/${chart}-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee /dev/stderr)
            digest=$(echo "${out}" | awk '/Digest:/ {print $2}')
            if [ -z "${digest}" ]; then
              echo "helm push did not report a digest for ${chart}; refusing to sign nothing" >&2
              exit 1
            fi
            digests="${digests} ghcr.io/${OWNER}/charts/${chart}@${digest}"
          done
          echo "refs=${digests# }" >> "$GITHUB_OUTPUT"

      - name: Sign the charts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: sigstore/cosign-installer@v4

      - name: Cosign keyless signature
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          REFS: ${{ steps.charts.outputs.refs }}
        shell: bash
        run: |
          set -euo pipefail
          # Keyless, so there is no signing key to hold or rotate: the signature is bound
          # to this workflow's identity, and a cluster can require it. A git tag can be
          # moved by anybody with write access; this cannot be forged by them.
          for ref in ${REFS}; do
            cosign sign --yes "${ref}"
          done
