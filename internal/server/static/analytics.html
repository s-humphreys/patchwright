<!--
  Leverage and neglect, not a league table.

  The queue answers "what is wrong right now". It cannot answer "what should we do
  first" or "what is nobody acting on", which is what a security team actually
  needs, and what people currently answer by eyeballing a table.

  An earlier version ranked teams by how slow they were. That reads as an
  accusation to whoever is on top of it, and it is rarely the useful question:
  most of the leverage here is a handful of base images, where one rebuild fixes
  everything built on them.

  A page of its own rather than a tab, for the same reason the ticket plan is: a
  different subject, read by different people at different times.
-->
