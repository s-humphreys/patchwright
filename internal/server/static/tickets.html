<!--
  A page of its own, not a tab on the dashboard.

  The dashboard's subject is the estate: what is vulnerable, who owns it, what to do about
  it. A plan about a tracker is a different subject that happens to be produced by the same
  service, and it sat above the queue where it was impossible to miss and usually beside
  the point. Three lines of "Jira is not configured" above the thing people came to read is
  noise on every single load.

  Separate page rather than a third tab because a tab implies another way of reading the
  same findings, which the other two are and this is not. It also means the dashboard no
  longer queries the tracker on load at all.
-->
<pw-nav page="tickets"></pw-nav>

<h2>Pending ticket actions
  <button id="ticketsRefresh" class="linkish" type="button"
    title="Recompute the plan against the tracker">recompute</button>
</h2>
<p class="meta">
  What ticket reconciliation would do right now. Read-only: nothing here is applied by
  opening this page, and there is no apply button.
</p>
<div id="pending">loading…</div>
