<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>patchwright</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    --bg: #fbfbfa; --fg: #1c1c1a; --muted: #6b6b66; --line: #e3e3df;
    --card: #ffffff; --warn-bg: #fff6e5; --warn-line: #e0b050; --warn-fg: #6b4c00;
    --urgent: #a4262c; --high: #b8590a; --medium: #6b6b00; --low: #4a6b4a;
    --ok: #1f6b3a; --idle: #6b6b66;
    --hover: #f0f0ed; --accent: #4a6b8a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --fg: #ebebe8; --muted: #9a9a94; --line: #2e2e2b;
      --card: #1e1e1c; --warn-bg: #2d2408; --warn-line: #8a6a1f; --warn-fg: #f0d491;
      --urgent: #f08a8f; --high: #e8a765; --medium: #cfcf7a; --low: #9ec49e;
      --ok: #7fd39a; --idle: #9a9a94;
      --hover: #262623; --accent: #7fa8cf;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.1rem; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); margin: 2rem 0 0.6rem; font-weight: 600; }
  header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
           border-bottom: 1px solid var(--line); padding-bottom: 0.8rem; }
  /* The same asset as the tab icon, 64px served and drawn at 24, so it stays crisp
     on a high-density display without embedding a second copy. */
  .brand { display: flex; align-items: center; gap: 0.5rem; }
  .logo { display: block; }
  .meta { color: var(--muted); font-size: 0.82rem; }
  .reasons { margin-top: 0.6rem; }
  .reasons-head { font-weight: 600; }
  .reasons ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
  .reasons li { margin: 0.15rem 0; }
  .reasons-more { margin-top: 0.3rem; opacity: 0.8; }
  .banner {
    margin: 1rem 0 0; padding: 0.7rem 0.9rem; border-radius: 6px;
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-fg);
    font-size: 0.88rem;
  }
  .tiles { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
          padding: 0.6rem 0.9rem; min-width: 7.5rem; }
  .tile .n { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--muted); font-size: 0.75rem; text-transform: uppercase;
             letter-spacing: 0.05em; }
  /* Fixed-height, scrollable table areas. Without a cap, 700 rows push the second
     table and every summary number off the screen, so the page can only be read
     top to bottom once. */
  .scroll { overflow: auto; max-height: 60vh; border: 1px solid var(--line);
            border-radius: 6px; background: var(--card); }
  .scroll.short { max-height: 34vh; }
  .scroll table { margin: 0; }
  .scroll th { position: sticky; top: 0; z-index: 1; background: var(--card);
               box-shadow: inset 0 -1px 0 var(--line); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--fg); }
  th .arrow { opacity: 0.55; font-size: 0.9em; }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  th, td { text-align: left; padding: 0.42rem 0.7rem; white-space: nowrap;
           border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem;
       text-transform: uppercase; letter-spacing: 0.05em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  /* One workload in seven namespaces must not push every other column off screen.
     The full list stays available on hover and via the expander. */
  td.clip { max-width: 16rem; overflow: hidden; text-overflow: ellipsis; }
  .more { cursor: pointer; color: var(--muted); border-bottom: 1px dotted var(--muted); }
  .more:hover { color: var(--fg); }
  code { font: 0.84em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .urgent { color: var(--urgent); font-weight: 600; }
  .high { color: var(--high); font-weight: 600; }
  .medium { color: var(--medium); }
  .low { color: var(--low); }
  .unknown { color: var(--muted); }
  /* Actionability, coloured consistently across the three columns that describe it:
     green means someone can do it now, amber means it is real work applied
     elsewhere, grey means there is nothing to do or nothing known. */
  .act-direct { color: var(--ok); font-weight: 600; }
  .act-managed { color: var(--high); }
  .act-none { color: var(--idle); }
  .act-unknown { color: var(--muted); font-style: italic; }
  .ticket-status { color: var(--muted); font-size: 0.9em; }
  /* Class rows are totals for the teams indented beneath them. */
  tr.rollup td { font-weight: 600; }
  td.indent { padding-left: 1.6rem; }
  tr.expandable { cursor: pointer; }
  tr.expandable:hover td, tr.expandable:focus-visible td { background: var(--hover); }
  tr.expandable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .caret { display: inline-block; width: 1rem; color: var(--muted); }
  .linkish {
    font: inherit; font-size: 0.78rem; font-weight: 500; margin-left: 0.6rem;
    background: none; border: 1px solid var(--line); border-radius: 4px;
    padding: 0.1rem 0.45rem; color: var(--muted); cursor: pointer;
  }
  .linkish:hover { color: var(--fg); }
  .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .act { font-family: ui-monospace, monospace; font-size: 0.78rem; }
  .act-create { color: var(--urgent); }
  .act-update, .act-extend { color: var(--high); }
  .act-close { color: var(--ok); }
  .cfg-file { margin: 0.6rem 0 1rem; }
  .cfg-path { font-family: ui-monospace, monospace; font-size: 0.8rem; color: var(--muted); }
  /* YAML highlighting, written here rather than pulled from a CDN: this page is
     served inside a cluster whose browsers may have no egress, and a security tool
     should not add a third-party script to its own status page. */
  .y-com { color: var(--muted); font-style: italic; }
  .y-key { color: var(--accent); }
  .y-str { color: var(--ok); }
  .y-lit { color: var(--high); }
  .y-dash { color: var(--muted); }
  .cfg-yaml {
    margin: 0.3rem 0 0; padding: 0.6rem 0.8rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; overflow-x: auto;
    font-family: ui-monospace, monospace; font-size: 0.78rem; line-height: 1.45;
    max-height: 26rem; overflow-y: auto;
  }
  th.sev-toggle { cursor: pointer; }
  th.sev-toggle:hover { color: var(--fg); }
  th.sev-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.sev-critical { color: var(--urgent); }
  td.sev-high { color: var(--high); }
  .pct { color: var(--muted); font-size: 0.9em; }
  .ticket-active { color: var(--ok); font-size: 0.9em; }
  .controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
              margin: 0.4rem 0 0.9rem; font-size: 0.85rem; color: var(--muted); }
  button { font: inherit; padding: 0.35rem 0.7rem; border-radius: 5px;
           border: 1px solid var(--line); background: var(--card); color: var(--fg);
           cursor: pointer; }
  button:hover { border-color: var(--muted); }
  input[type="search"] { font: inherit; font-size: 0.85rem; padding: 0.25rem 0.45rem;
    border-radius: 5px; border: 1px solid var(--line); background: var(--card);
    color: var(--fg); min-width: 17rem; }
  select { font: inherit; font-size: 0.85rem; padding: 0.2rem 0.3rem; border-radius: 5px;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .err { color: var(--urgent); }
  a { color: inherit; text-decoration: underline; text-underline-offset: 2px;
      text-decoration-color: var(--muted); }
  a:hover { text-decoration-color: currentColor; }
</style>

<header>
  <span class="brand"><img class="logo" src="/favicon.png" alt="" width="24" height="24"><h1>patchwright</h1></span>
  <span class="meta" id="freshness">loading…</span>
  <span class="meta" id="dataAge"></span>
  <span style="flex:1"></span>
  <button id="refresh" title="Ask the server to run a new assessment">Refresh assessment</button>
</header>

<div id="coverage"></div>

<div class="tiles" id="tiles"></div>

<h2>Pending ticket actions
  <button id="ticketsRefresh" class="linkish">refresh</button>
</h2>
<div id="pending"></div>

<h2>Rules
  <button id="configToggle" class="linkish" aria-expanded="false">show config</button>
</h2>
<div id="config" hidden></div>

<h2>Breakdown</h2>
<div class="scroll short"><table id="breakdown">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table></div>

<h2>Queue</h2>
<div class="controls">
  <input type="search" id="search" placeholder="search image, team, namespace, ticket"
         title="Case-insensitive substring match across the image reference, team, namespaces, the upgrade text and any ticket key.">
  <label>class <select id="classFilter"><option value="">all</option></select></label>
  <label>team <select id="teamFilter"><option value="">all</option></select></label>
  <label>fix <select id="fixFilter"><option value="">all</option></select></label>
  <label title="Only findings with a version to move to: a direct image bump, or one applied via a chart or operator. Hides those already on their latest release and those whose versions could not be resolved."><input type="checkbox" id="onlyFixable"> has a fix</label>
  <label title="Actionable is the policy verdict: this warrants action. It is not the same as having a version to move to, which is the Fix column - an image already on its latest release can still be actionable, and needs a decision rather than a bump."><input type="checkbox" id="onlyActionable" checked> actionable only</label>
  <label><input type="checkbox" id="showSuppressed"> include suppressed</label>
  <span id="queueCount"></span>
</div>
<div class="scroll"><table id="findings">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table></div>

<script>
// The page deliberately mirrors the CLI's vocabulary. Anything the report shows as
// unknown must show as unknown here too: a dashboard that renders missing data as
// a zero is the failure mode this whole feature exists to prevent.
const $ = (sel) => document.querySelector(sel);

function fixPath(f) {
  const u = f.upgrade;
  if (!u) return f.remediation_checked ? "unknown" : "?";
  if (!u.resolved) return "unknown";
  if (!u.available) return "none";
  return u.actionable ? "direct" : "managed";
}

function upgradeText(f) {
  const u = f.upgrade;
  if (!u || !u.resolved) return "?";
  if (!u.available) return "-";
  let s = `${u.current} -> ${u.latest}`;
  if (u.kind === "chart") s = "chart " + s;
  // Named for a base upgrade: a bare version range on a first-party image reads as
  // the application's own version moving, which is the confusion this exists to
  // remove. What moved is the base, and which base is what the rebuild points at.
  if (u.kind === "base") s = `base ${u.name} ${u.current} -> ${u.latest}`;
  if (!u.actionable) s += ` (${u.managed || "managed"})`;
  return s;
}

// upgradeTitle puts the detail behind a hover: the full base reference, or the reason
// a lookup could not answer. "?" with no explanation is the least useful thing a
// column can say, and the reason is usually the actionable part — "this image records
// no base" is a build-system fix somebody can make today.
function upgradeTitle(f) {
  const u = f.upgrade;
  if (!u) {
    return f.remediation_checked
      ? "No upgrade information for this image."
      : "Upgrade detection did not run (no --remediation).";
  }
  if (!u.resolved) {
    return u.reason
      ? `Could not determine an upgrade: ${u.reason}`
      : "Could not determine an upgrade, and no reason was given.";
  }
  const parts = [];
  if (u.kind === "base") {
    parts.push(`The base image ${u.source || u.name} is what carries these CVEs;` +
      " the fix is to rebuild on a newer one.");
  }
  if (!u.available) parts.push("Already on the latest available version.");
  if (u.managed) parts.push(`Version owned by ${u.manager || u.managed}.`);
  return parts.join(" ");
}

// Provider counts are only meaningful if the provider actually assessed the image.
const count = (f, sev) => (f.provider_assessed ? (f.counts?.[sev] ?? 0) : "?");
const epss = (f) => (f.exploit_checked ? maxEPSS(f).toFixed(2) : "-");
const live = (f) => (f.liveness ? (f.liveness.live ? "yes" : "no") : "?");
// cell renders a multi-value dimension compactly: the first value, then how many
// more, with the full list on hover and one click to expand. Joining seven
// namespaces inline pushed every other column off the screen.
function cell(values) {
  const v = values || [];
  if (!v.length) return "-";
  const all = esc(v.join(", "));
  if (v.length === 1) return `<span title="${all}">${esc(v[0])}</span>`;
  return `<span class="more" title="${all}" data-all="${all}"
    onclick="this.textContent=this.dataset.all">${esc(v[0])} +${v.length - 1}</span>`;
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function get(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}

// hasAssessment distinguishes "no assessment yet" from a real, empty result. The
// API answers 200 with zeros before the first run completes, and a zero-value
// timestamp is the only way to tell them apart.
function hasAssessment(a) {
  return !!(a && a.generated_at && !a.generated_at.startsWith("0001-01-01"));
}

// elapsed renders how long the in-flight assessment has been running. A full run
// crosses every cluster and scans every image, so minutes of apparent silence are
// normal and worth distinguishing from a hang.
function elapsed(a) {
  if (!a || !a.started_at) return "";
  const secs = Math.max(0, Math.round((Date.now() - new Date(a.started_at)) / 1000));
  return secs < 60 ? ` (${secs}s)` : ` (${Math.floor(secs / 60)}m ${secs % 60}s)`;
}

function renderFreshness(a) {
  const el = $("#freshness");
  if (a && a.error) {
    el.textContent = `last refresh failed: ${a.error}`;
    el.className = "meta err";
    return;
  }
  if (!hasAssessment(a)) {
    // A first full assessment can take many minutes (every cluster, every image),
    // and showing zeros meanwhile would read as a clean estate.
    el.textContent = a && a.running
      ? `first assessment in progress${elapsed(a)}, this can take several minutes`
      : "no assessment yet";
    el.className = "meta";
    return;
  }
  let text = `assessed ${new Date(a.generated_at).toLocaleString()}`;
  if (a.running) text += ` (refresh in progress${elapsed(a)})`;
  el.textContent = text;
  el.className = "meta";
}

// renderDataAge states when the scan provider last looked, which is a different
// question from when this pipeline last ran. A server refreshing hourly over a
// mounted export reports a fresh assessment forever while the data underneath it
// ages; without this, a week-old export is indistinguishable from a current one.
function renderDataAge(s) {
  const el = $("#dataAge");
  if (!s.provider_data_newest) {
    el.textContent = "";
    return;
  }
  const newest = new Date(s.provider_data_newest);
  const days = Math.floor((Date.now() - newest) / 86400000);
  const age = days < 1 ? "today" : days === 1 ? "1 day old" : `${days} days old`;
  el.textContent = `· scan data ${newest.toLocaleDateString()} (${age})`;
  // Older than a couple of days is worth noticing rather than reading past: the
  // queue is only as current as the export behind it.
  el.className = days >= 2 ? "meta err" : "meta";
  el.title = "When the scan provider last assessed these images, as opposed to when"
    + " this assessment ran. A stale export produces a fresh-looking assessment of old data.";
}

function renderCoverage(s) {
  const total = s.provider_assessed + s.provider_unassessed;
  if (!total) return;
  const pct = Math.round((s.provider_assessed / total) * 100);
  // Lead with coverage, not the actionable count: "N actionable" out of an estate
  // nobody scanned is not good news, and reading it as such is the mistake.
  const el = $("#coverage");
  if (s.provider_unassessed === 0) {
    el.innerHTML = "";
    return;
  }
  // Deliberately does not claim the actionable figure covers only assessed
  // findings: a vulnerability scanner can find fixable CVEs the provider never
  // looked for, and on a real estate 14 of 35 actionable findings came from that
  // alone. Overstating in the other direction would be the same kind of error.
  const scannerOnly = s.actionable_unassessed
    ? ` ${s.actionable_unassessed} of the ${s.actionable} actionable findings are on
        images the provider never assessed, found by the vulnerability scanner alone.`
    : "";
  el.innerHTML = `<div class="banner"><strong>${s.provider_unassessed} of ${total} findings
    were never assessed by the scan provider</strong> (${pct}% covered). Their severity counts
    are absent data rather than zero, so they cannot match a count-based rule.${scannerOnly}
    ${s.remediation_unresolved ? `${s.remediation_unresolved} findings have no resolvable upgrade.` : ""}
    ${reasonList(s.unassessed_reasons)}</div>${signalNotice(s)}`;
}

// signalNotice reports a missing signal by its consequence, not its name.
//
// A column of dashes says "no EPSS here". It does not say the thing that matters:
// every rule of the form vulns.exists(...) is false without per-CVE detail, so the
// urgent and high tiers cannot fire at all and the queue reads as calm when it is
// merely uninformed. That is worth a sentence at the top rather than a dash
// repeated down a column.
//
// The column stays either way. Removing it would hide the gap instead of naming
// it, and an absent column reads as "this does not apply" rather than "this was
// not gathered".
function signalNotice(s) {
  if (s.scanned === undefined) return "";       // older API, say nothing
  if (s.scanned === 0) {
    return `<div class="banner"><strong>No image was scanned for per-CVE detail.</strong>
      Fix availability, EPSS and KEV are therefore absent, and every rule requiring
      <code>vulns</code> is false — so no finding can reach the priorities that depend on
      them, however bad it is. Counts from the scan provider still work. Add
      <code>--vuln-source trivy</code> (chart: <code>scan.enabled</code>) to populate it.</div>`;
  }
  if (s.exploit_checked === 0) {
    return `<div class="banner"><strong>Exploit intelligence was not gathered.</strong>
      ${s.scanned} findings have per-CVE detail, but none carry EPSS or KEV, so rules
      requiring exploitation pressure cannot fire and the EPSS column reads "-" rather
      than 0. Add <code>--exploit-source public</code> (chart:
      <code>scan.exploitSource</code>).</div>`;
  }
  // Partial coverage is worth stating too: it is the case most easily mistaken for
  // full coverage, since the columns are populated for some rows.
  if (s.exploit_checked < s.scanned) {
    return `<div class="banner">${s.scanned - s.exploit_checked} of ${s.scanned} scanned
      findings have no exploit intelligence, so their EPSS is unknown rather than low.</div>`;
  }
  return "";
}

// reasonList renders the provider's own reasons for the coverage gap, largest
// first.
//
// This is the difference between a statistic and a work list. A percentage
// invites resignation; "cannot authenticate to the registry, 734 findings" names
// something one person can fix in an afternoon, and on a real estate a single
// cause accounted for nearly the whole gap. It stays on the page until it is
// fixed, rather than living in one Slack thread.
//
// Absent when the provider states no reasons — the CSV export never does — which
// is not the same as there being no cause.
function reasonList(reasons) {
  if (!reasons || !reasons.length) return "";
  const top = reasons.slice(0, 4);
  const rest = reasons.length - top.length;
  const items = top.map((r) =>
    `<li><strong>${r.findings}</strong> ${esc(r.reason)}</li>`).join("");
  return `<div class="reasons"><div class="reasons-head">Why the provider has no data:</div>
    <ul>${items}</ul>
    ${rest > 0 ? `<div class="reasons-more">and ${rest} other reason${rest === 1 ? "" : "s"}.</div>` : ""}
    </div>`;
}

function renderTiles(s) {
  const tiles = [
    ["Findings", s.findings], ["Actionable", s.actionable],
    ["Assessed", s.provider_assessed], ["Suppressed", s.suppressed],
    ["Upgradable", s.upgradable], ["Known exploited", s.known_exploited],
    ["Unique images", s.unique_images],
  ];
  $("#tiles").innerHTML = tiles.map(([l, n]) =>
    `<div class="tile"><div class="n">${n ?? "-"}</div><div class="l">${esc(l)}</div></div>`).join("");
}

// Column definitions drive both rendering and sorting, so the two cannot disagree
// about what a column contains.
//
// sort is the comparison key, not the displayed text: "urgent" must outrank
// "high" rather than sorting after it alphabetically, and a "?" count must not
// sort as if it were a number. Unknowns sort to the bottom in both directions,
// since "we do not know" is never the answer someone is looking for at the top.
const UNKNOWN = Number.NEGATIVE_INFINITY;

const FIX_RANK = { direct: 4, managed: 3, none: 2, unknown: 1, "?": 0 };
const FIX_CLASS = { direct: "act-direct", managed: "act-managed", none: "act-none",
                    unknown: "act-unknown", "?": "act-unknown" };
const fixClass = (f) => FIX_CLASS[fixPath(f)] || "act-unknown";

// Every state that could be read as "fine" gets an explanation, because the ones
// that mean "we do not know" are the ones most easily mistaken for good news.
const FIX_HELP = {
  direct: "A newer version this image can move to now.",
  managed: "A newer version exists, but a chart or operator owns the tag, so the bump is applied there. Still real work.",
  none: "Already on the latest available version. Nothing to upgrade to, so criticals here need a decision (wait for upstream, rebuild, or accept) rather than a bump.",
  unknown: "Detection ran but could not resolve the available versions, e.g. a private registry whose tags cannot be listed. NOT a statement that it is up to date.",
  "?": "Upgrade detection did not run for this assessment.",
};
const PRI_RANK = { urgent: 4, high: 3, medium: 2, low: 1 };

const FINDING_COLUMNS = [
  { label: "Priority", cls: (f) => priorityClass(f), get: (f) => priorityText(f),
    sort: (f) => (f.suppressed ? 0 : PRI_RANK[f.priority] ?? 0),
    help: "The policy verdict, set by your rules. urgent means a fixable CVE that is exploited or likely to be (KEV or high EPSS), which outranks severity alone. This is NOT the same as having something to upgrade to; see Fix.",
    title: (f) => (f.suppressed
      ? "Suppressed by policy: " + ((f.reasons || [])[0] || "no reason recorded")
      : (f.reasons || [])[0] || "") },
  { label: "Team", get: (f) => esc(f.owner?.team || "-"), sort: (f) => f.owner?.team || "",
    help: "The attributed owning team. \"-\" means no ownership rule could attribute this workload, which is usually a missing namespace label rather than a vulnerability.",
    title: (f) => (f.owner?.team ? `owner rule: ${f.owner.rule || "unknown"}` : "No ownership rule matched") },
  { label: "Namespace", td: "clip", get: (f) => cell(f.dimensions?.namespace),
    sort: (f) => (f.dimensions?.namespace || [])[0] || "",
    help: "Namespaces this image runs in. Click a \"+N\" to expand the full list." },
  { label: "Image", td: "clip", title: (f) => f.image,
    get: (f) => `<code>${esc(f.image)}</code>`, sort: (f) => f.image || "",
    help: "The image reference as deployed, digest included where pinned." },
  { label: "Crit", num: true, get: (f) => esc(count(f, "critical")),
    sort: (f) => (f.provider_assessed ? f.counts?.critical ?? 0 : UNKNOWN),
    help: "Critical count from the scan provider. \"?\" means the provider never assessed this image, so nothing is known about it. That is not the same as zero.",
    title: (f) => (f.provider_assessed ? "" : "The scan provider never assessed this image; its counts are absent, not zero.") },
  { label: "Fixcrit", num: true, get: (f) => esc(fixcrit(f)),
    sort: (f) => (isScanned(f) ? f.fixable_critical ?? 0 : UNKNOWN),
    help: "Critical CVEs with a fix available, from the vulnerability scanner. \"-\" means the image was not scanned.",
    title: (f) => (isScanned(f) ? "" : "Not scanned, so fix availability is unknown.") },
  // Kept even when nothing gathered it: a column of "-" says the signal was not
  // collected, whereas removing the column says the signal does not exist.
  { label: "EPSS", num: true, get: (f) => esc(epss(f)),
    sort: (f) => (f.exploit_checked ? maxEPSS(f) : UNKNOWN),
    help: "Highest EPSS across this image's CVEs: the predicted probability of exploitation in the next 30 days (0-1). A CVSS 10 at EPSS 0.008 is less urgent than a CVSS 5 at 0.93. \"-\" means exploit intel was not gathered." },
  { label: "Live", get: (f) => esc(live(f)),
    sort: (f) => (!f.liveness ? UNKNOWN : f.liveness.live ? 1 : 0),
    help: "Whether this image is running in a cluster right now. \"?\" means no live reconciliation ran." },
  { label: "Fix", cls: fixClass, get: (f) => fixPath(f),
    sort: (f) => FIX_RANK[fixPath(f)] ?? 0,
    help: "Whether there is a version to move to, and where the change is applied: direct, managed (via a chart or operator), none (already latest), unknown (could not resolve), ? (detection did not run).",
    title: (f) => FIX_HELP[fixPath(f)] || "" },
  { label: "Upgrade", cls: fixClass, get: (f) => esc(upgradeText(f)), title: upgradeTitle,
    sort: (f) => upgradeText(f),
    help: "The version move available. Chart versions are prefixed \"chart\" because they are the chart's, not the image tag shown in Image.",
    title: (f) => (f.upgrade?.source ? `change in ${f.upgrade.source}${f.upgrade.source_path ? " path " + f.upgrade.source_path : ""}` : "") },
  { label: "Ticket", get: (f) => ticketCell(f), sort: (f) => ticketSort(f),
    help: "Open Jira tickets covering this image. \"-\" means no open ticket; \"?\" means Jira is not configured, so ticket state is unknown." },
];


function ticketsFor(f) {
  return ticketsByRepo ? ticketsByRepo[f.repository] || [] : [];
}

// "-" means no open ticket; "?" means we were not able to look. Conflating them
// would be the same mistake as printing an unscanned image's counts as zero.
function ticketCell(f) {
  if (!ticketsByRepo) return '<span class="unknown" title="Jira is not configured, so ticket state is unknown">?</span>';
  const refs = ticketsFor(f);
  if (!refs.length) return "-";
  return refs.map((t) => {
    const title = esc(t.summary || t.status);
    const key = t.url
      ? `<a href="${esc(t.url)}" target="_blank" rel="noreferrer" title="${title}">${esc(t.key)}</a>`
      : `<span title="${title}">${esc(t.key)}</span>`;
    // "indeterminate" is Jira's category for in-flight work. Status NAMES are
    // per-project ("NEEDS REFINEMENT"), so the category is what can be relied on
    // to say whether anyone has actually picked it up.
    const cls = t.category === "indeterminate" ? "ticket-active" : "ticket-status";
    const status = t.status ? ` <span class="${cls}">${esc(t.status.toLowerCase())}</span>` : "";
    return key + status;
  }).join(", ");
}

// Sort so findings with a ticket group together, then by key.
function ticketSort(f) {
  const refs = ticketsFor(f);
  return refs.length ? refs[0].key : "";
}

const isScanned = (f) => f.scanned || (f.vulns || []).length > 0;
const fixcrit = (f) => (isScanned(f) ? f.fixable_critical ?? 0 : "-");
const maxEPSS = (f) => (f.vulns || []).reduce((m, v) => Math.max(m, v.epss || 0), 0);
const priorityText = (f) => (f.suppressed ? "supp" : f.priority || "-");
const priorityClass = (f) => {
  const p = priorityText(f);
  return PRI_RANK[p] ? p : "unknown";
};

// One sort state per table. Null means the server's own order, which is already
// the queue order someone works top-down, so it stays the default.
const sortState = { findings: null };

function compare(col, dir) {
  return (a, b) => {
    const x = col.sort(a), y = col.sort(b);
    if (typeof x === "string" || typeof y === "string") {
      return dir * String(x).localeCompare(String(y));
    }
    // Unknowns sink to the bottom whichever way the column is sorted.
    if (x === UNKNOWN && y === UNKNOWN) return 0;
    if (x === UNKNOWN) return 1;
    if (y === UNKNOWN) return -1;
    return dir * (x - y);
  };
}

function renderTable(id, columns, rows) {
  const state = sortState[id];
  let data = rows.slice();
  if (state) {
    data.sort(compare(columns[state.index], state.dir));
  }

  const head = document.querySelector(`#${id} thead tr`);
  head.innerHTML = columns.map((c, i) => {
    const active = state && state.index === i;
    const arrow = active ? `<span class="arrow">${state.dir > 0 ? "▲" : "▼"}</span>` : "";
    const help = c.help ? esc(c.help) + " (click to sort)" : `Sort by ${esc(c.label)}`;
    return `<th class="sortable${c.num ? " num" : ""}" data-i="${i}"
      title="${help}">${esc(c.label)} ${arrow}</th>`;
  }).join("");
  head.querySelectorAll("th").forEach((th) => {
    th.onclick = () => {
      const i = Number(th.dataset.i);
      // First click on a column sorts descending: for every numeric column here,
      // the interesting end is the top.
      sortState[id] = state && state.index === i
        ? (state.dir < 0 ? { index: i, dir: 1 } : null)
        : { index: i, dir: -1 };
      renderTable(id, columns, rows);
    };
  });

  document.querySelector(`#${id} tbody`).innerHTML = data.map((row) => "<tr>" +
    columns.map((c) => {
      const cls = [c.num ? "num" : "", typeof c.td === "string" ? c.td : "",
                   c.cls ? c.cls(row) : ""].filter(Boolean).join(" ");
      const title = c.title ? ` title="${esc(c.title(row))}"` : "";
      return `<td${cls ? ` class="${cls}"` : ""}${title}>${c.get(row)}</td>`;
    }).join("") + "</tr>").join("");
}

// pct renders a share, and says "-" rather than "0%" when the denominator is zero:
// nought out of nought is not a measurement.
function pct(n, of) {
  if (!of) return '<span class="pct">-</span>';
  return `<span class="pct">${Math.round((n / of) * 100)}%</span>`;
}

// countPct puts the number first and the share second, so a row can be read either
// as "how many" or "how much of it", and a small absolute number cannot hide behind
// a large percentage.
function countPct(n, of) {
  return `${n} ${pct(n, of)}`;
}

// Breakdown: one row per owner class, with its teams indented beneath.
//
// Every column is a share of something stated, because the raw counts alone
// mislead in both directions here: a team with two actionable findings out of six
// looks quiet next to one with twenty out of seven hundred, and a team with 100%
// coverage of four images is not in better shape than one with 40% of two hundred.
// severityExpanded splits the CVEs column into one column per severity. A column
// toggle rather than a per-row one: severity is a property of every row, so
// expanding it row by row would mean the same question asked repeatedly, and a
// second kind of expansion inside rows that already expand into teams.
let severityExpanded = false;

const SEVERITIES = ["critical", "high", "medium", "low"];
const SEVERITY_LABELS = { critical: "CRIT", high: "HIGH", medium: "MED", low: "LOW" };

// cveTotal only counts the severities we name, so an odd bucket from some future
// provider cannot inflate a total whose breakdown does not account for it.
function cveTotal(r) {
  return SEVERITIES.reduce((n, sev) => n + (r.cves?.[sev] || 0), 0);
}

// cveCell renders a count, or "?" when nothing in the row was assessed. Zero
// CVEs and no CVE data look identical otherwise, and on a real estate the
// second is far more common than the first.
function cveCell(r, n) {
  if (!r.cvesFrom) {
    return `<span class="unknown" title="Nothing in this row was assessed by the scan provider, so there is no CVE data. Not the same as no CVEs.">?</span>`;
  }
  // The coverage stays in the tooltip rather than beside the number. Rendered
  // inline it read as a fraction of the CVE count, which is a worse error than
  // the one it was guarding against, and the Assessed column already states the
  // same denominator two columns to the left.
  const cov = r.cvesFrom < r.total
    ? ` Drawn from the ${r.cvesFrom} of ${r.total} findings the provider assessed, so it is a floor, not a total.`
    : "";
  return `<span title="Provider counts across this row.${cov}">${n.toLocaleString()}</span>`;
}

// cveColumns is the CVEs column, or the per-severity split when expanded. The
// header carries the toggle so it reads as one column that opens.
function cveColumns() {
  if (!severityExpanded) {
    return [{ label: "CVEs", num: true, expandSeverity: true,
      get: (r) => cveCell(r, cveTotal(r)),
      help: "Total CVEs the scan provider counted across this row, from provider-assessed findings only. Click to split by severity. \"?\" means nothing here was assessed." }];
  }
  return SEVERITIES.map((sev, i) => ({
    label: SEVERITY_LABELS[sev], num: true, expandSeverity: i === 0,
    cls: () => `sev-${sev}`,
    get: (r) => cveCell(r, r.cves?.[sev] || 0),
    help: `${sev[0].toUpperCase()}${sev.slice(1)} CVEs the provider counted, from provider-assessed findings only. Click to collapse back to a total.`,
  }));
}

const BREAKDOWN_COLUMNS = [
  { label: "Class / team", get: (r) => breakdownLabel(r), cls: (r) => (r.team ? "indent" : ""),
    help: "Owner class, with its teams beneath. Classes with more than one team expand. Percentages are of that row's own findings unless stated." },
  { label: "Findings", num: true, get: (r) => `${r.total} ${pct(r.total, r.estate)}`,
    help: "Findings owned, and the share of the whole estate they represent." },
  { label: "Assessed", num: true, get: (r) => countPct(r.total - r.unassessed, r.total),
    help: "Findings the scan provider actually assessed. A low share means the rest of this row's numbers describe a small sample." },
  { severitySlot: true },
  { label: "Actionable", num: true, get: (r) => countPct(r.actionable, r.total),
    help: "Findings policy marked for action, as a share of this row's findings." },
  { label: "Direct", num: true, get: (r) => countPct(r.direct, r.actionable),
    help: "Actionable findings this team can fix by bumping the image itself." },
  { label: "Managed", num: true, get: (r) => countPct(r.managed, r.actionable),
    help: "Actionable findings whose version is owned by a chart or operator, so the fix crosses a boundary." },
  { label: "Fixable", num: true, get: (r) => countPct(r.fixable, r.actionable),
    help: "Actionable findings with at least one critical CVE that has a fix available." },
  // "?" rather than "0%" when Jira is not configured: an unknown is not an absence,
  // and a column reading "0% ticketed" would say the work is untracked when the
  // truth is that nobody asked Jira.
  { label: "Ticketed", num: true,
    get: (r) => (ticketsByRepo ? countPct(r.ticketed, r.actionable)
      : '<span class="unknown" title="Jira is not configured, so ticket state is unknown">?</span>'),
    help: "Actionable findings with an open ticket. \"?\" when Jira is not configured, which is not the same as nothing being tracked." },
];

// expandedClasses survives a re-render, so an hourly refresh does not collapse a
// class someone had opened to read.
const expandedClasses = new Set();

// breakdownLabel renders the row's name, and for a class with teams beneath it a
// caret plus the team count, so it is visible that there is more to see rather
// than the collapsed rollup looking like the whole story.
function breakdownLabel(r) {
  if (r.team || !r.children) return r.label;
  const open = expandedClasses.has(r.key);
  return `<span class="caret">${open ? "\u25be" : "\u25b8"}</span>${r.label}` +
    ` <span class="pct">(${r.children} team${r.children === 1 ? "" : "s"})</span>`;
}

// breakdownColumns resolves the column set against the current severity state.
function breakdownColumns() {
  return BREAKDOWN_COLUMNS.flatMap((c) => (c.severitySlot ? cveColumns() : [c]));
}

function renderBreakdown(owners) {
  const rows = [];
  const estate = (owners || []).reduce((n, o) => n + o.total, 0);

  // Group by class, then roll the class up from its teams so the totals cannot
  // disagree with the rows beneath them.
  const byClass = new Map();
  for (const o of owners || []) {
    const cls = o.class || "-";
    if (!byClass.has(cls)) byClass.set(cls, []);
    byClass.get(cls).push(o);
  }
  const sum = (list, key) => list.reduce((n, o) => n + (o[key] || 0), 0);
  const sumCounts = (list) => list.reduce((acc, o) => {
    for (const sev of SEVERITIES) acc[sev] = (acc[sev] || 0) + (o.cves?.[sev] || 0);
    return acc;
  }, {});

  for (const [cls, teams] of [...byClass].sort((a, b) => sum(b[1], "actionable") - sum(a[1], "actionable"))) {
    rows.push({
      label: esc(cls), key: cls, estate, team: false,
      cves: sumCounts(teams), cvesFrom: sum(teams, "cves_from"),
      // Rows are only worth expanding when they say something the rollup does
      // not, so a class with a single team stays a leaf: the team row would be
      // a copy of the class row.
      children: teams.length > 1 ? teams.length : 0,
      total: sum(teams, "total"), unassessed: sum(teams, "unassessed"),
      actionable: sum(teams, "actionable"), direct: sum(teams, "direct"),
      managed: sum(teams, "managed"), fixable: sum(teams, "fixable"),
      ticketed: sum(teams, "ticketed"),
    });
    // Only break a class down when there is more than one team in it; a single
    // team repeated under its own class is noise.
    if (teams.length < 2 || !expandedClasses.has(cls)) continue;
    for (const o of [...teams].sort((a, b) => b.actionable - a.actionable)) {
      rows.push({
        label: esc(o.team || "(unattributed)"), key: cls, estate, team: true,
        cves: o.cves, cvesFrom: o.cves_from,
        total: o.total, unassessed: o.unassessed, actionable: o.actionable,
        direct: o.direct, managed: o.managed, fixable: o.fixable, ticketed: o.ticketed,
      });
    }
  }

  const columns = breakdownColumns();
  const head = document.querySelector("#breakdown thead tr");
  head.innerHTML = columns.map((c) => {
    const cls = [c.num ? "num" : "", c.expandSeverity ? "sev-toggle" : ""].filter(Boolean).join(" ");
    const label = c.expandSeverity
      ? `<span class="caret">${severityExpanded ? "\u25c2" : "\u25b8"}</span>${esc(c.label)}`
      : esc(c.label);
    return `<th class="${cls}"${c.expandSeverity ? ' role="button" tabindex="0"' +
      ` aria-expanded="${severityExpanded}"` : ""} title="${esc(c.help)}">${label}</th>`;
  }).join("");
  document.querySelector("#breakdown tbody").innerHTML = rows.map((r) => {
    const cells = columns.map((c) => {
      const cls = [c.num ? "num" : "", c.cls ? c.cls(r) : ""].filter(Boolean).join(" ");
      return `<td${cls ? ` class="${cls}"` : ""}>${c.get(r)}</td>`;
    }).join("");
    if (r.team) return `<tr>${cells}</tr>`;
    const expandable = r.children > 0;
    // The whole row is the control, so the click target is the size of the row
    // rather than a caret someone has to aim at.
    return `<tr class="rollup${expandable ? " expandable" : ""}"` +
      (expandable ? ` data-class="${esc(r.key)}" tabindex="0" role="button"` +
        ` aria-expanded="${expandedClasses.has(r.key)}"` : "") +
      `>${cells}</tr>`;
  }).join("");
  lastOwners = owners;
}

// lastOwners is kept so toggling re-renders from the same data instead of
// refetching: expanding a row is a display change, not a new question.
let lastOwners = null;

function toggleBreakdownClass(key) {
  if (expandedClasses.has(key)) expandedClasses.delete(key);
  else expandedClasses.add(key);
  renderBreakdown(lastOwners);
}

function toggleSeverityColumns() {
  severityExpanded = !severityExpanded;
  renderBreakdown(lastOwners);
}

$("#breakdown").addEventListener("click", (e) => {
  if (e.target.closest("th.sev-toggle")) toggleSeverityColumns();
});
$("#breakdown").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (!e.target.closest("th.sev-toggle")) return;
  e.preventDefault();
  toggleSeverityColumns();
});

// Delegated so it survives the re-render that follows every toggle.
$("#breakdown").addEventListener("click", (e) => {
  const row = e.target.closest("tr.expandable");
  if (row) toggleBreakdownClass(row.dataset.class);
});
$("#breakdown").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest("tr.expandable");
  if (!row) return;
  e.preventDefault(); // Space would otherwise scroll the page.
  toggleBreakdownClass(row.dataset.class);
});

function renderFindings(rows) {
  $("#queueCount").textContent = rows.length === queueRows.length
    ? `${rows.length} shown`
    : `${rows.length} of ${queueRows.length} shown`;
  renderTable("findings", FINDING_COLUMNS, rows);
}

// UNATTRIBUTED stands for findings no ownership rule could attribute to a team.
// The API treats an empty team parameter as "no filter", so this case cannot be
// expressed as a query and is filtered here instead. It is worth having: an
// unowned finding is a thing to fix in the cluster labels, and being able to list
// them is how that gets noticed.
const UNATTRIBUTED = "\u0000unattributed";

let queueRows = [];
// Open tickets by image repository, from the API. Undefined means Jira is not
// configured, which is NOT the same as "no ticket exists" and must not render as
// if it were.
let ticketsByRepo;

async function loadFindings() {
  const params = new URLSearchParams();
  if ($("#onlyActionable").checked) params.set("actionable", "true");
  if ($("#showSuppressed").checked) params.set("suppressed", "true");
  const d = await get("/api/v1/findings?" + params);
  queueRows = d.findings || [];
  ticketsByRepo = d.tickets;
  populateOwnerFilters(queueRows);
  applyOwnerFilters();
  renderFreshness(d.assessment);
}

// Options come from the rows actually present, so the dropdowns can never offer a
// team with nothing behind it, and each carries its count.
function populateOwnerFilters(rows) {
  const classSel = $("#classFilter"), teamSel = $("#teamFilter");
  const chosenClass = classSel.value, chosenTeam = teamSel.value;

  const classes = new Map();
  for (const f of rows) {
    const c = f.owner?.class || "-";
    classes.set(c, (classes.get(c) || 0) + 1);
  }
  const teams = new Map();
  for (const f of rows) {
    if (chosenClass && (f.owner?.class || "-") !== chosenClass) continue;
    const key = f.owner?.team ? f.owner.team : UNATTRIBUTED;
    teams.set(key, (teams.get(key) || 0) + 1);
  }

  const fill = (sel, entries, allLabel, keep) => {
    const opts = [`<option value="">${allLabel} (${rows.length})</option>`];
    for (const [value, n] of [...entries].sort((a, b) => b[1] - a[1])) {
      const label = value === UNATTRIBUTED ? "(unattributed)" : value;
      opts.push(`<option value="${esc(value)}">${esc(label)} (${n})</option>`);
    }
    sel.innerHTML = opts.join("");
    // Keep the selection if it still exists, so a refresh does not reset the view.
    sel.value = [...sel.options].some((o) => o.value === keep) ? keep : "";
  };
  fill(classSel, classes, "all classes", chosenClass);
  fill(teamSel, teams, "all teams", chosenTeam);

  const fixSel = $("#fixFilter");
  const chosenFix = fixSel.value;
  const fixCounts = new Map();
  for (const f of rows) {
    if (chosenClass && (f.owner?.class || "-") !== chosenClass) continue;
    const p = fixPath(f);
    fixCounts.set(p, (fixCounts.get(p) || 0) + 1);
  }
  const ordered = ["direct", "managed", "none", "unknown", "?"]
    .filter((k) => fixCounts.has(k));
  fixSel.innerHTML = [`<option value="">all fixes (${rows.length})</option>`]
    .concat(ordered.map((k) => `<option value="${esc(k)}">${esc(k)} (${fixCounts.get(k)})</option>`))
    .join("");
  fixSel.value = [...fixSel.options].some((o) => o.value === chosenFix) ? chosenFix : "";
}

// haystack is what the search box matches against: the fields someone would
// plausibly type a fragment of. Ticket keys are included so "PROJ-12" finds
// every image a grouped ticket covers.
function haystack(f) {
  const parts = [
    f.image, f.repository, f.registry, f.owner?.team, f.owner?.class, f.priority,
    (f.dimensions?.namespace || []).join(" "),
    (f.dimensions?.account || []).join(" "),
    upgradeText(f), fixPath(f),
    ticketsFor(f).map((t) => `${t.key} ${t.status}`).join(" "),
  ];
  return parts.filter(Boolean).join(" ").toLowerCase();
}

function applyOwnerFilters() {
  const c = $("#classFilter").value, t = $("#teamFilter").value, x = $("#fixFilter").value;
  const q = $("#search").value.trim().toLowerCase();
  const rows = queueRows.filter((f) => {
    if (c && (f.owner?.class || "-") !== c) return false;
    if (t === UNATTRIBUTED && f.owner?.team) return false;
    if (t && t !== UNATTRIBUTED && f.owner?.team !== t) return false;
    // Fix is a separate question from actionable: "does policy say act" versus
    // "is there a version to move to". An image on its latest release can be both
    // actionable and unfixable, which is a decision rather than a bump.
    if (x && fixPath(f) !== x) return false;
    // "Has a fix" is the common case of the dropdown: something to move to,
    // whether applied here or via a chart or operator.
    if ($("#onlyFixable").checked && !["direct", "managed"].includes(fixPath(f))) return false;
    if (q && !haystack(f).includes(q)) return false;
    return true;
  });
  renderFindings(rows);
}

// Pending ticket actions.
//
// The page showed which findings had tickets but nothing about writes waiting to
// happen, so an imminent rewrite or close was invisible unless someone read the logs.
// A service about to change a tracker should say so where people are looking.
//
// Read-only by design: there is no apply button. A POST that writes to Jira should
// not be one stray click away from a dashboard behind a shared token.
const PENDING_COLUMNS = [
  { label: "Action", get: (a) => `<span class="act act-${esc(a.kind)}">${esc(a.kind)}</span>` },
  // Linked the same way the queue links tickets: a plan naming a key you then have
  // to search for is a plan you read once.
  { label: "Ticket", get: (a) => {
      if (!a.ticket) return '<span class="pct">new</span>';
      return a.url
        ? `<a href="${esc(a.url)}" target="_blank" rel="noreferrer">${esc(a.ticket)}</a>`
        : esc(a.ticket);
    } },
  { label: "Tracker", get: (a) => esc(a.route || "-") },
  { label: "What", get: (a) => esc(a.summary || a.comment || a.why || "") },
];

async function loadPending() {
  const el = $("#pending");
  let plan;
  try {
    plan = await get("/api/v1/tickets");
  } catch (e) {
    // Ticketing being unconfigured is a normal state, not a fault, and must not
    // look like one.
    el.innerHTML = `<div class="meta">Ticket reconciliation is unavailable: ${esc(e.message)}</div>`;
    return;
  }

  // Skips are counted, not listed: "already correct" is worth knowing and not worth
  // a row each.
  const writes = (plan.actions || []).filter((a) => a.kind !== "skip");
  const skipped = (plan.actions || []).length - writes.length;
  if (writes.length === 0) {
    el.innerHTML = `<div class="meta">Nothing to write.
      ${skipped} ticket${skipped === 1 ? "" : "s"} already cover their findings.</div>`;
    return;
  }

  const counts = {};
  for (const a of writes) counts[a.kind] = (counts[a.kind] || 0) + 1;
  const breakdown = Object.entries(counts).map(([k, n]) => `${n} ${k}`).join(", ");

  // Whether these will be applied is the difference between a plan and a warning.
  const fate = plan.auto_apply
    ? `<strong>These will be applied on the next scheduled refresh.</strong>`
    : `These are not applied automatically: auto-ticketing is off.`;

  el.innerHTML = `<div class="banner"><strong>${writes.length} pending write${
    writes.length === 1 ? "" : "s"}</strong> (${esc(breakdown)}). ${fate}</div>
    <div class="scroll short"><table>
      <thead><tr>${PENDING_COLUMNS.map((c) => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${writes.map((a) =>
        `<tr>${PENDING_COLUMNS.map((c) => `<td>${c.get(a)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
}

// Manual, because computing the plan queries the tracker: doing that on every poll
// would put a Jira round trip behind an idle browser tab.
$("#ticketsRefresh").addEventListener("click", loadPending);

// The rules, on demand. Fetched on first open rather than with every refresh: they
// change when someone deploys, not hourly, and they are the largest payload here.
let configLoaded = false;

// Minimal YAML highlighting: comments, keys, quoted strings and literals.
//
// Deliberately not a parser. It never has to produce a value, only make structure
// visible, so a line it does not recognise is emitted verbatim rather than guessed
// at — the failure mode is plain text, not wrong text.
function highlightYAML(text) {
  return text.split("\n").map(highlightYAMLLine).join("\n");
}

function highlightYAMLLine(line) {
  const [code, comment] = splitComment(line);
  let out = "";

  // "  - name: platform" and "  name: platform" differ only by the marker.
  const m = code.match(/^(\s*)(-\s+)?([A-Za-z0-9_.\-\/]+)(\s*:)(\s*)(.*)$/);
  if (m) {
    const [, indent, dash, key, colon, gap, value] = m;
    out = esc(indent)
      + (dash ? `<span class="y-dash">${esc(dash)}</span>` : "")
      + `<span class="y-key">${esc(key)}</span>${esc(colon)}${esc(gap)}`
      + highlightValue(value);
  } else {
    // A bare list item, e.g. "  - cloud-provider".
    const li = code.match(/^(\s*)(-\s+)(.*)$/);
    out = li
      ? esc(li[1]) + `<span class="y-dash">${esc(li[2])}</span>` + highlightValue(li[3])
      : esc(code);
  }
  return out + (comment ? `<span class="y-com">${esc(comment)}</span>` : "");
}

// highlightValue marks quoted strings and scalars. An image reference or a CEL
// expression is left as plain text, which is what it should look like.
function highlightValue(value) {
  if (value === "") return "";
  // Trailing whitespace before a comment would otherwise stop a quoted value
  // matching, so the same string was coloured on one line and not the next.
  const trimmed = value.replace(/\s+$/, "");
  const tail = value.slice(trimmed.length);
  const mark = (cls) => `<span class="${cls}">${esc(trimmed)}</span>` + esc(tail);
  if (/^(['"]).*\1$/.test(trimmed)) return mark("y-str");
  if (/^(true|false|null|~|-?\d+(\.\d+)?)$/.test(trimmed)) return mark("y-lit");
  return esc(value);
}

// splitComment separates a trailing comment, ignoring a "#" inside quotes — a CEL
// expression or an image tag can contain one, and colouring the rest of the line as
// a comment would misrepresent the config being explained.
function splitComment(line) {
  let quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote) {
      if (c === quote) quote = null;
      continue;
    }
    if (c === "'" || c === '"') { quote = c; continue; }
    // A "#" only starts a comment at the start of the line or after whitespace,
    // so a URL fragment or a tag is not mistaken for one.
    if (c === "#" && (i === 0 || /\s/.test(line[i - 1]))) {
      return [line.slice(0, i), line.slice(i)];
    }
  }
  return [line, ""];
}

async function loadConfig() {
  const el = $("#config");
  try {
    const cfg = await get("/api/v1/config");
    el.innerHTML = (cfg.sources || []).map((src) => `
      <div class="cfg-file">
        <div class="cfg-path">${esc(src.path)}${src.redacted
          ? ' <span class="pct">— a value was redacted</span>' : ""}</div>
        <pre class="cfg-yaml">${highlightYAML(src.content)}</pre>
      </div>`).join("");
  } catch (e) {
    // Says which question cannot be answered, rather than only that a fetch failed.
    el.innerHTML = `<div class="banner">Could not read the loaded rules: ${esc(e.message)}.
      This is what the assessment was run with, so without it the verdicts on this page
      cannot be explained.</div>`;
  }
}

$("#configToggle").addEventListener("click", async () => {
  const el = $("#config"), btn = $("#configToggle");
  const opening = el.hidden;
  el.hidden = !opening;
  btn.setAttribute("aria-expanded", String(opening));
  btn.textContent = opening ? "hide config" : "show config";
  if (opening && !configLoaded) {
    configLoaded = true;
    await loadConfig();
  }
});

async function loadAll() {
  try {
    const [summary, owners] = await Promise.all([
      get("/api/v1/summary"), get("/api/v1/owners"),
    ]);
    renderFreshness(summary.assessment);
    if (!hasAssessment(summary.assessment)) {
      // Show nothing rather than zeros: an empty dashboard is honest, a dashboard
      // of zeros is a claim.
      $("#coverage").innerHTML = `<div class="banner">No assessment has completed yet,
        so there is nothing to report. A full run reconciles every cluster and scans every
        image, which takes several minutes; this page fills in as soon as it finishes.</div>`;
      if (summary.assessment?.running) setTimeout(loadAll, 5000);
      $("#tiles").innerHTML = "";
      $("#findings tbody").innerHTML = "";
      $("#breakdown tbody").innerHTML = "";
      $("#queueCount").textContent = "";
      $("#dataAge").textContent = "";
      return;
    }
    renderCoverage(summary.summary);
    renderDataAge(summary.summary);
    renderTiles(summary.summary);
    // Findings first: they carry whether Jira was consulted, which the breakdown
    // needs in order to distinguish "no tickets" from "not asked".
    await loadFindings();
    renderBreakdown(owners.owners);
    // Once per load, not per poll: see loadPending.
    loadPending();
  } catch (e) {
    $("#freshness").textContent = `error: ${e.message}`;
    $("#freshness").className = "meta err";
  }
}

$("#onlyActionable").addEventListener("change", loadFindings);
$("#showSuppressed").addEventListener("change", loadFindings);
$("#classFilter").addEventListener("change", () => {
  // Team options depend on the chosen class, so rebuild them before filtering.
  populateOwnerFilters(queueRows);
  applyOwnerFilters();
});
$("#teamFilter").addEventListener("change", applyOwnerFilters);
$("#fixFilter").addEventListener("change", applyOwnerFilters);
$("#onlyFixable").addEventListener("change", applyOwnerFilters);
$("#search").addEventListener("input", applyOwnerFilters);
$("#refresh").addEventListener("click", async () => {
  await fetch("/api/v1/assessments", { method: "POST" });
  // The refresh is asynchronous, so poll until the server stops reporting it.
  const poll = setInterval(async () => {
    const s = await get("/api/v1/summary");
    if (!s.assessment?.running) { clearInterval(poll); loadAll(); }
    else renderFreshness(s.assessment);
  }, 2000);
});

loadAll();
setInterval(loadAll, 60000);
</script>
