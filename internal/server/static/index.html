<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>patchwright</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/static/app/app.css">

<header>
  <span class="brand"><img class="logo" src="/favicon.png" alt="" width="24" height="24"><h1>patchwright</h1></span>
  <span class="meta" id="freshness">loading…</span>
  <span class="meta" id="dataAge"></span>
  <span style="flex:1"></span>
  <nav class="pages"><a href="/tickets">Ticket plan</a></nav>
  <button id="refresh" title="Ask the server to run a new assessment">Refresh assessment</button>
</header>

<div id="coverage"></div>

<div class="tiles" id="tiles"></div>

<h2>Rules
  <button id="configToggle" class="linkish" aria-expanded="false">show config</button>
</h2>
<div id="config" hidden></div>

<h2>Breakdown</h2>
<div class="scroll short"><table id="breakdown">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table></div>

<h2>Queue</h2>
<div class="controls">
  <!-- Two rows on purpose. Selects narrow the set; toggles change what counts as being
       in it. Mixed together they wrapped mid-group, which read as one long unsorted
       list of controls rather than two short decisions. -->
  <div class="controls-row">
    <input type="search" id="search" placeholder="search image, team, namespace, ticket"
           title="Case-insensitive substring match across the image reference, team, namespaces, the upgrade text and any ticket key.">
    <label class="sel">class <select id="classFilter"><option value="">all</option></select></label>
    <label class="sel">team <select id="teamFilter"><option value="">all</option></select></label>
    <label class="sel" title="Policy's verdict on how pressing each finding is. Ordered worst first, because the list is a scale and sorting it as text puts high above urgent.">urgency <select id="urgencyFilter"><option value="">all</option></select></label>
    <label class="sel">signal <select id="signalFilter"><option value="">all</option></select></label>
    <label class="sel">fix <select id="fixFilter"><option value="">all</option></select></label>
  </div>
  <div class="controls-row toggles">
    <label class="toggle" title="Actionable is the policy verdict: this warrants action. It is not the same as having a version to move to, which is the Fix column - an image already on its latest release can still be actionable, and needs a decision rather than a bump."><input type="checkbox" id="onlyActionable" checked> actionable only</label>
    <label class="toggle" title="Only findings with a version to move to: a direct image bump, or one applied via a chart or operator. Hides those already on their latest release and those whose versions could not be resolved."><input type="checkbox" id="onlyFixable"> has a fix</label>
    <label class="toggle"><input type="checkbox" id="showSuppressed"> include suppressed</label>
    <label class="toggle" title="One row per piece of work: a service and the base it rebuilds onto, covering every deployed tag. Uncheck to list every deployment separately, which is what you want when asking where something runs rather than what to do about it."><input type="checkbox" id="groupRows" checked> group by service</label>
    <span id="queueCount"></span>
  </div>
</div>
<div class="tabs" role="tablist">
  <button class="tab" id="tabQueue" role="tab" aria-selected="true" aria-controls="panelQueue">Queue</button>
  <button class="tab" id="tabCVEs" role="tab" aria-selected="false" aria-controls="panelCVEs">CVEs</button>
</div>

<div id="panelQueue" class="tab-panel" role="tabpanel" aria-labelledby="tabQueue">
<div class="scroll"><table id="findings">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table></div>
<p class="meta">Select a row for everything known about it: CVEs, exposure, coverage, the
  fix path and what is already in progress.</p>
</div>

<!-- The same data by CVE rather than by image: what security asks is how far one CVE
     reaches, which the queue can only answer by reading every row. -->
<div id="panelCVEs" class="tab-panel" role="tabpanel" aria-labelledby="tabCVEs" hidden>
  <p class="meta" id="cveNote"></p>
  <div class="scroll"><table id="cves">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table></div>
  <p class="meta">Select a CVE for every image carrying it, the teams involved, and where
    a fix exists.</p>
</div>

<!-- The detail panel. Everything the queue no longer carries as a column lives here,
     per finding, on demand. -->
<aside id="detail" class="detail" hidden aria-label="Finding details"></aside>

<script type="module" src="/static/app/main.js"></script>
