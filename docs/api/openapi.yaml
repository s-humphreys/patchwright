openapi: 3.1.0
info:
  title: patchwright
  version: v1
  description: |
    Read-only access to the latest cached assessment, plus ticket reconciliation.

    Every endpoint except `/healthz`, `/readyz` and `/metrics` requires the shared
    token when `PATCHWRIGHT_API_TOKEN` is set: `Authorization: Bearer <token>`, or
    HTTP Basic with the token as the password so a browser can be prompted.

    Absent data and zero are different states throughout. A finding with
    `provider_assessed: false` has zero severity counts because nothing looked, not
    because nothing was found; `scanned` and `exploit_checked` say the same for the
    optional scanners. Consumers that treat them as equivalent will report an
    unscanned estate as a clean one.
  license:
    name: MIT
    url: https://github.com/s-humphreys/patchwright/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local or port-forwarded

security:
  - bearerAuth: []

tags:
  - name: findings
  - name: tickets
  - name: operations
  - name: mcp

paths:
  /:
    get:
      tags: [operations]
      summary: Live-status page
      description: HTML. Reads the API below, so the two cannot disagree.
      responses:
        "200":
          description: The status page
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets:
    get:
      tags: [operations]
      summary: Ticket plan page
      description: |
        HTML, and a page of its own rather than a tab on the dashboard: the dashboard's
        subject is the estate, while this is what reconciliation would write to a
        tracker. Reads GET /api/v1/tickets. Read-only - opening it applies nothing.
      responses:
        "200":
          description: The ticket plan page
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /analytics:
    get:
      tags: [operations]
      summary: Security analytics page
      description: |
        HTML. Per-team responsiveness: who is working through their findings and who is
        sitting on them. A page of its own because its subject is how teams are
        RESPONDING, not what is wrong - a different question read by different people.
        Reads GET /api/v1/analytics.
      responses:
        "200":
          description: The analytics page
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/analytics:
    get:
      tags: [analysis]
      summary: Per-team responsiveness
      description: |
        Who is moving on their findings and who is not, computed from the latest cached
        assessment.

        The headline metric is `stale_unstarted`: actionable findings with an upgrade
        available, no open pull request, no ticket, and older than `stale_fix_days`. A
        fix has existed for a month and nothing has moved, which is a statement about
        the team rather than about the software.

        `notes` lists the questions this endpoint is asked and cannot answer - read it
        before building a dashboard on this, because the gaps are the part most likely
        to be assumed away. Ticket resolution time is the notable one: the tracker index
        holds only open tickets and carries no dates.
      responses:
        "200":
          description: Per-team responsiveness
          content:
            application/json:
              schema:
                type: object
                required: [assessment, analytics]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  analytics: { $ref: "#/components/schemas/Analytics" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/findings:
    get:
      tags: [findings]
      summary: List findings
      parameters:
        - { name: owner_class, in: query, schema: { type: string }, description: "Owner class, e.g. platform" }
        - { name: team, in: query, schema: { type: string } }
        - { name: repository, in: query, schema: { type: string }, description: "Bare repository, e.g. storefront" }
        - { name: priority, in: query, schema: { type: string, enum: [urgent, high, medium, low] } }
        - { name: actionable, in: query, schema: { type: boolean } }
        - { name: live, in: query, schema: { type: boolean } }
        - { name: upgradable, in: query, schema: { type: boolean } }
        - { name: known_exploited, in: query, schema: { type: boolean } }
        - { name: suppressed, in: query, schema: { type: boolean } }
        - name: provider_assessed
          in: query
          schema: { type: boolean }
          description: "`false` lists the coverage gap: findings nobody has data for."
        - { name: remediation_checked, in: query, schema: { type: boolean } }
        - { name: upgrade_resolved, in: query, schema: { type: boolean } }
        - name: vulns
          in: query
          schema: { type: boolean, default: true }
          description: >-
            `false` omits the per-CVE arrays. They are 97% of a real payload - on one
            estate 41MB against 1.3MB, 92KB compressed - so a caller listing the queue
            should pass it and read `vuln_count`, `top_epss`, `top_epss_percentile`,
            `top_risk_score` and `known_exploited` instead. Fetch
            `/api/v1/finding?image=` for one image's CVEs, or `/api/v1/cves` for the
            estate aggregated by CVE.
      responses:
        "200":
          description: Matching findings
          content:
            application/json:
              schema:
                type: object
                required: [assessment, findings]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }
                  tickets:
                    description: |
                      Open tickets keyed by image repository. Absent when Jira is not
                      configured, which means unknown rather than "no ticket exists".
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: "#/components/schemas/TicketRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoAssessment" }

  /api/v1/finding:
    get:
      tags: [findings]
      summary: One image's finding
      parameters:
        - name: image
          in: query
          required: true
          schema: { type: string }
          description: Full image reference or repository
      responses:
        "200":
          description: The finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No finding for that image }

  /api/v1/items:
    get:
      tags: [findings]
      summary: The queue as work items
      description: |
        Findings grouped into the units people act on: one item per owning team, service
        and upgrade target — the same key a ticket uses, so an item, a queue row and a
        ticket are one thing.

        Every aggregate states its own limits. `priority` is the worst across the item's
        deployments and `priority_where` names where that came from; `assessed_images`
        short of `deployments` means the counts are the worst KNOWN rather than the
        worst; `in_flight_checked` is true only when every deployment was checked.

        Accepts the same filters as /api/v1/findings.
      parameters:
        - { name: team, in: query, schema: { type: string } }
        - { name: owner_class, in: query, schema: { type: string } }
        - { name: repository, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string, enum: [urgent, high, medium, low] } }
        - { name: upgradable, in: query, schema: { type: boolean } }
        - { name: known_exploited, in: query, schema: { type: boolean } }
        - { name: suppressed, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Work items, worst first
          content:
            application/json:
              schema:
                type: object
                required: [assessment, count, items]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/service:
    get:
      tags: [findings]
      summary: One service's outstanding work
      description: |
        The work items for a single repository — one request for a service catalogue
        component page, keyed by the repository the catalogue already knows.

        `known` is false when this assessment contains no finding for the service at
        all. An empty `items` list with `known: false` is ignorance rather than health,
        and a consumer cannot tell the two apart from the array alone.
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
        - { name: suppressed, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The service's items
          content:
            application/json:
              schema:
                type: object
                required: [assessment, repository, known, count, items]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  repository: { type: string }
                  known: { type: boolean }
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
        "400": { description: repository is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoAssessment" }

  /api/v1/cves:
    get:
      tags: [findings]
      summary: The estate by CVE
      description: |
        Vulnerabilities across the estate, worst first: known-exploited, then severity,
        then exploitation pressure, then reach. This is the scope-of-work question,
        which the per-service queue can only answer by reading every row.

        `images` and `services` are both reported because they answer different
        questions: how many deployments carry it, and how many pieces of work fixing it
        takes. One base-image CVE on 535 images is a handful of rebuilds.

        Per-CVE detail exists only where a vulnerability source ran, so
        `scanned_findings` and `total_findings` travel with the answer. Zero CVEs over
        zero scanned findings means nothing was looked at, not that nothing was found.
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low] } }
        - { name: kev, in: query, schema: { type: boolean }, description: CISA known-exploited only }
        - name: fixable
          in: query
          schema: { type: boolean }
          description: |
            true keeps CVEs with a fix on at least one affected image; false keeps those
            with none anywhere, which is the waiting-on-upstream list.
        - { name: min_images, in: query, schema: { type: integer } }
        - { name: min_services, in: query, schema: { type: integer } }
        - { name: team, in: query, schema: { type: string } }
      responses:
        "200":
          description: CVEs, worst first
          content:
            application/json:
              schema:
                type: object
                required: [assessment, count, scanned_findings, total_findings, cves]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  count: { type: integer }
                  scanned_findings: { type: integer }
                  total_findings: { type: integer }
                  cves:
                    type: array
                    items: { $ref: "#/components/schemas/CVE" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/cve:
    get:
      tags: [findings]
      summary: One CVE and every image carrying it
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: team, in: query, schema: { type: string } }
      responses:
        "200":
          description: The CVE, with its affected images
          content:
            application/json:
              schema:
                type: object
                required: [assessment, cve]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  cve: { $ref: "#/components/schemas/CVE" }
        "400": { description: id is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            No scanned image carries it. The response carries scanned_findings and
            total_findings, because "not found" over an unscanned estate means nothing
            looked rather than nothing carries it.
        "503": { $ref: "#/components/responses/NoAssessment" }

  /api/v1/owners:
    get:
      tags: [findings]
      summary: Per-team triage
      responses:
        "200":
          description: One row per owner class and team
          content:
            application/json:
              schema:
                type: object
                required: [assessment, owners]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  owners:
                    type: array
                    items: { $ref: "#/components/schemas/OwnerStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoAssessment" }

  /api/v1/summary:
    get:
      tags: [findings]
      summary: Fleet-wide headline and coverage
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [assessment, summary]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  summary: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/NoAssessment" }

  /api/v1/config:
    get:
      tags: [operations]
      summary: The loaded rules
      description: |
        The ownership and policy configuration as parsed at startup — not the files as
        they are on disk now, which may include edits that are not in effect.

        Values of keys that look like credentials are replaced with `[redacted]`.
        Nothing should ever match, since credentials come from the environment by
        design; the check exists because the cost of being wrong is a credential in a
        browser tab.
      responses:
        "200":
          description: One entry per config file, in load order
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      required: [path, content]
                      properties:
                        path: { type: string }
                        content: { type: string, description: YAML as loaded. }
                        redacted:
                          type: boolean
                          description: A value in this file was withheld.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No configuration was loaded }

  /api/v1/policy:
    get:
      tags: [operations]
      summary: The estate against your own policy rules
      description: |
        What YOUR configured rules decided, by the names they carry in your config:
        what each actionable rule caught, what each suppression is holding and when
        that decision lapses, the split by your own priority labels and by team, and
        what no rule had an opinion about.

        Built for a periodic security review. It is the same report the `policy_report`
        MCP tool returns, from the same code, so a review pack assembled here cannot
        disagree with one an agent produced from the tool.

        Distinct from `/api/v1/analytics`, which is patchwright's own judgement of what
        is worth acting on. This one adds no judgement of its own: it reports what your
        rules said.

        Read `caveats` before any number. The first one is always that this is the
        state at the moment the assessment ran — patchwright keeps no history, so a
        report on a monthly cadence is a snapshot and not a record of the month.
      responses:
        "200":
          description: The policy report
          content:
            application/json:
              schema:
                type: object
                required: [assessment, policy]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  policy: { $ref: "#/components/schemas/PolicyReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: >-
            No assessment has completed yet. Deliberately not an empty report, which
            would read as an estate no rule found anything in.

  /api/v1/exploitability:
    get:
      tags: [operations]
      summary: What is actually being exploited, and how much of it is fixable
      description: |
        How much of what the estate carries is being exploited, and how much of it can
        be moved on today. Broken down per team alongside each team's urgent count,
        with the worst CVEs named.

        The headline unit is **work items over actionable findings**, grouped by
        service — the same numbers the queue page shows at
        `?signal=kev&fixable=true`, from the same findings, filters and grouping code.
        A tool that reported a different figure for the same question than the page a
        team already uses would be worse than one that stayed quiet.

        Same code as the `exploitability_report` MCP tool.

        Three things govern how every number must be read, all repeated in `caveats`:

        - The headline counts are **work items**. The `cves` block underneath counts
          distinct vulnerabilities, answers a different question, and will not match.
        - **"Has a fix" means an upgrade path**, not a published patch. An image can
          carry a patched CVE and still have nowhere to move to.
        - Per-CVE detail exists only for scanned deployments, so every count is a
          **lower bound**, never a total. Check `coverage`.
      parameters:
        - name: epss_threshold
          in: query
          required: false
          schema: { type: number, minimum: 0, maximum: 1 }
          description: >-
            EPSS probability to count above (default 0.5, matching the threshold the
            service and team reports use). Rejected rather than defaulted when invalid:
            a caller who asked for 0.9 and silently got 0.5 would read the counts as
            theirs.
      responses:
        "200":
          description: The exploitability report
          content:
            application/json:
              schema:
                type: object
                required: [assessment, exploitability]
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
                  exploitability: { $ref: "#/components/schemas/ExploitabilityReport" }
        "400": { description: "epss_threshold was not a probability in (0, 1]" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: No assessment has completed yet }

  /api/v1/assessments:
    post:
      tags: [operations]
      summary: Trigger a refresh
      description: Returns immediately; the refresh runs in the background.
      responses:
        "202":
          description: Refresh started, or already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment: { $ref: "#/components/schemas/AssessmentMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/tickets:
    get:
      tags: [tickets]
      summary: What ticket reconciliation would do
      description: Computed from the cached assessment. Changes nothing.
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Ticketing is not configured, or no assessment is cached
    post:
      tags: [tickets]
      summary: Apply the plan
      description: |
        The only endpoint that changes anything outside patchwright. Requires
        `{"confirm": true}`; without it the plan is returned with a 400 rather than
        applied, so a bare POST cannot write to a tracker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPlan" }
        "400":
          description: Not confirmed; the plan is returned unapplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  actions:
                    type: array
                    items: { $ref: "#/components/schemas/TicketAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /mcp:
    post:
      tags: [mcp]
      summary: Model Context Protocol endpoint (JSON-RPC over Streamable HTTP)
      description: |
        Read-only MCP tools answering from the same cached assessment the API serves:
        `fix_plan`, `estate_summary`, `service_report`, `worst_first`, `team_report`,
        `explain_cve`, `list_facets`.

        Not a REST endpoint. The body is JSON-RPC 2.0 as defined by the MCP
        Streamable HTTP transport, and it is documented here only so the route is
        discoverable; use an MCP client rather than calling it by hand.

        It is authenticated exactly like every other route, so a machine caller needs
        the shared token wherever one is configured. Interactive sign-in cannot serve
        an MCP client: set the token alongside it where machine callers are expected.
      responses:
        "200":
          description: JSON-RPC response, or an SSE stream when the client accepts one
          content:
            application/json:
              schema: { type: object }
    get:
      tags: [mcp]
      summary: Server-to-client event stream for an MCP session
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema: { type: string }
    delete:
      tags: [mcp]
      summary: End an MCP session
      responses:
        "204":
          description: Session ended

  /metrics:
    get:
      tags: [operations]
      summary: Prometheus metrics
      description: |
        Prefixed `patchwright_`, plus `go_*` and `process_*`. Unauthenticated unless
        `--metrics-require-auth` is set.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }

  /healthz:
    get:
      tags: [operations]
      summary: Liveness
      security: []
      responses:
        "200": { description: Serving }

  /readyz:
    get:
      tags: [operations]
      summary: Readiness
      description: Ready once a first assessment is cached.
      security: []
      responses:
        "200": { description: An assessment is cached }
        "503": { description: No assessment cached yet }

  # A prefix route rather than a templated path: the mux serves this subtree, and the
  # drift test compares the served pattern with what is documented here, so the two
  # have to be written the same way.
  /static/app/:
    get:
      tags: [operations]
      summary: Status page assets
      description: |
        The page's JavaScript modules and stylesheet, appended to this prefix (e.g.
        `/static/app/main.js`), from the same embedded tree as the page. Behind the same
        auth as the page, since together they are the page.
      responses:
        "200":
          description: The asset
          content:
            text/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such asset }

  /favicon.png:
    get:
      tags: [operations]
      summary: Favicon
      security: []
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `PATCHWRIGHT_API_TOKEN`. HTTP Basic with any username and the token as the
        password also works, so a browser can be prompted for the status page.

  responses:
    Unauthorized:
      description: Missing or invalid token
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    NoAssessment:
      description: No assessment has completed yet
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  schemas:
    AssessmentMeta:
      type: object
      required: [generated_at, running]
      properties:
        generated_at: { type: string, format: date-time }
        running: { type: boolean }
        version:
          type: string
          description: |
            The build serving this. Reported so a reader can tell which deployment
            they are looking at rather than inferring it from the image tag they
            believe is running, which is what goes wrong when a rollout half
            succeeds. "dev" when the binary was not stamped at build time.
        started_at:
          type: string
          format: date-time
          description: When the in-flight assessment started.
        error:
          type: string
          description: |
            Set when the most recent run failed. The previously cached result is
            still served, so a failed refresh does not blank the API.

    Movable:
      type: object
      description: A set of work items and how much of it can be acted on today.
      properties:
        items:
          type: integer
          description: >-
            Work items - one service and one upgrade target - grouped exactly as the
            queue page groups them with "group by service" ticked. This is the headline
            unit: it is what there is to do.
        items_with_fix:
          type: integer
          description: |
            Those with a resolved, available upgrade to move to: the queue's "has a fix"
            tick.

            NOT the same as a CVE having a published fixed version, which is
            `cves.kev_fixable`. An image can carry a patched CVE and still have nowhere
            to move to, because nobody has built a release containing the patch.
        items_without_fix: { type: integer }
        items_with_fix_pct:
          type: number
          description: >-
            That share, 0-100 - what can be moved on right now. ABSENT when there are no
            items: a percentage of nothing is not 0%, and rendering it as one turns
            "nothing to do" into "nothing can be done".
        deployments:
          type: integer
          description: >-
            What those items cover - the blast radius, not the queue length. A service
            at three tags on one upgrade target is one item and three deployments.
        services: { type: integer }

    CVEStats:
      type: object
      description: >-
        The vulnerability-level view of the same findings: DISTINCT CVEs, not items. It
        answers a different question from the item counts and will not equal them -
        one CVE spans many services and one service carries many CVEs.
      properties:
        total: { type: integer, description: Distinct CVEs with per-CVE detail in scope. }
        kev:
          type: integer
          description: >-
            Distinct CVEs in CISA's Known Exploited Vulnerabilities catalogue:
            confirmed exploitation in the wild, not a prediction.
        kev_fixable:
          type: integer
          description: >-
            How many have a published fixed version, counted when ANY affected image
            reports one. A statement about the CVE ("a patch exists"), not about the
            work ("we have somewhere to move to").
        kev_no_fix:
          type: integer
          description: >-
            The rest. These need a decision - mitigate, isolate or accept - rather than
            an upgrade.
        kev_fixable_pct: { type: number, description: "Absent when kev is 0." }
        epss_above: { type: integer }
        epss_above_fixable: { type: integer }

    ExploitStats:
      type: object
      description: |
        Exploitability for one scope, led by WORK ITEMS because that is the unit the
        queue page counts and a ticket covers.

        Computed from the same findings, the same filters and the same grouping code as
        that page, so the two cannot report different numbers for the same question.
      properties:
        known_exploited:
          allOf:
            - $ref: "#/components/schemas/Movable"
            - description: Items carrying a CVE in CISA's KEV catalogue.
        epss_above:
          allOf:
            - $ref: "#/components/schemas/Movable"
            - description: >-
                Items carrying a CVE above the report's EPSS threshold - predicted
                rather than observed exploitation. An item can be in both sets.
        cves: { $ref: "#/components/schemas/CVEStats" }

    ExploitabilityReport:
      type: object
      required: [freshness, coverage, epss_threshold, estate, by_team]
      properties:
        freshness: { type: object }
        coverage:
          type: object
          description: >-
            Bounds every count. Per-CVE detail exists only for scanned deployments, so
            every number here is a floor.
        epss_threshold:
          type: number
          description: >-
            The probability the epss_above_* counts were taken at, echoed so a
            threshold-dependent number is never stated without its threshold.
        estate: { $ref: "#/components/schemas/ExploitStats" }
        by_team:
          type: array
          description: Worst first — exploited before predicted, then by how much can be moved.
          items:
            allOf:
              - $ref: "#/components/schemas/ExploitStats"
              - type: object
                properties:
                  team: { type: string }
                  class: { type: string }
                  urgent_deployments:
                    type: integer
                    description: >-
                      Deployments the policy rated urgent, on the same unit as
                      /api/v1/policy's by_team so the two cannot disagree.
        top_cves:
          type: array
          description: >-
            The worst carried, named. A report of counts alone cannot be acted on: the
            first question after "we have 13" is always "which ones".
          items:
            type: object
            properties:
              id: { type: string }
              severity: { type: string }
              known_exploited: { type: boolean }
              epss: { type: number }
              epss_percentile: { type: number }
              fix_available: { type: boolean }
              fixed_version: { type: string }
              deployments: { type: integer }
              services: { type: integer }
              teams: { type: array, items: { type: string } }
              top_services: { type: array, items: { type: string } }
        caveats:
          type: array
          items: { type: string }
          description: What bounds these numbers. Read before any of them.

    PolicyReport:
      type: object
      required: [freshness, scope, coverage, verdicts, actionable_rules, suppress_rules]
      properties:
        freshness:
          type: object
          description: When this ran, how old the provider's own data is, and which stages ran.
        scope:
          type: object
          description: The denominator for everything below.
          properties:
            deployments: { type: integer }
            services: { type: integer }
            work_items:
              type: integer
              description: >-
                The unit a ticket covers - one service and one upgrade - which is what a
                queue length means to a team. `deployments` is what a coverage
                percentage means. Different numbers on purpose.
            teams: { type: integer }
        coverage:
          type: object
          description: |
            How much of the estate these counts describe. A rule that did not match an
            unassessed image has not cleared it: there was nothing to match on.

            Over UNSUPPRESSED deployments, matching the MCP tools, so its total is
            `verdicts.actionable + verdicts.no_rule_matched` rather than
            `scope.deployments`.
        verdicts:
          type: object
          description: >-
            Every deployment by what policy decided. The three sum to
            `scope.deployments`, so the arithmetic is checkable.
          properties:
            actionable: { type: integer }
            suppressed: { type: integer }
            no_rule_matched:
              type: integer
              description: |
                Neither queued work nor accepted risk: policy has no opinion. Reported
                as a first-class number because it is invisible everywhere else — not
                in the queue, not in the suppression list — and a rule set with a large
                one is not covering the estate it governs.
        actionable_rules:
          type: array
          description: |
            In the order the rules are EVALUATED, not by size. That order is the
            policy's own statement of severity; sorting by count would put the biggest
            bucket above the sharpest one.
          items:
            type: object
            properties:
              name: { type: string }
              priority: { type: string }
              when:
                type: string
                description: The rule's condition, so the report reads without the config open beside it.
              deployments: { type: integer }
              services: { type: integer }
              teams: { type: integer }
              top_services:
                type: array
                items: { type: string }
                description: Worst affected, bounded. Use /api/v1/items for the full work list.
              matched:
                type: boolean
                description: >-
                  False when the rule caught nothing. Stated rather than left as a zero:
                  a rule listed and quiet is a different thing from a rule that does not
                  exist, and a report built only from findings cannot tell them apart.
        suppress_rules:
          type: array
          description: What policy decided is not work, and when each decision lapses.
          items:
            type: object
            properties:
              name: { type: string }
              when: { type: string }
              deployments: { type: integer }
              services: { type: integer }
              top_services: { type: array, items: { type: string } }
              until: { type: string, description: "The date it lapses, YYYY-MM-DD." }
              expired:
                type: boolean
                description: >-
                  Lapsed. The findings it was hiding are back in the queue, so a rise
                  since the last report may be a policy decision expiring rather than
                  the estate getting worse.
              expires_in_days: { type: integer }
              no_expiry:
                type: boolean
                description: >-
                  No expiry date, so nothing will bring it back for review. Accepted
                  risk with no expiry is accepted risk forever.
        by_priority:
          type: array
          description: Keyed by the priority labels your config defines, whatever those are.
          items:
            type: object
            properties:
              priority: { type: string }
              deployments: { type: integer }
              services: { type: integer }
              work_items: { type: integer }
        by_team:
          type: array
          items:
            type: object
            properties:
              team: { type: string }
              class: { type: string }
              actionable: { type: integer }
              suppressed: { type: integer }
              no_rule_matched: { type: integer }
              by_priority:
                type: object
                additionalProperties: { type: integer }
        unmatched:
          type: object
          description: What no rule spoke to.
          properties:
            deployments: { type: integer }
            services: { type: integer }
            top_services: { type: array, items: { type: string } }
            with_criticals:
              type: integer
              description: >-
                How many carry a critical the provider reported. Without it the number
                reads as harmless leftovers; with it, it is the count of known criticals
                the policy declined to have an opinion about.
        caveats:
          type: array
          items: { type: string }
          description: >-
            What this report cannot support, worst misreading first. Read before any
            number in it.

    Finding:
      type: object
      required:
        [image, registry, repository, owner, counts, risk, actionable, suppressed,
         workload_count, provider_assessed, scanned, exploit_checked,
         remediation_checked, dimensions]
      properties:
        image: { type: string }
        registry: { type: string }
        repository: { type: string }
        tag: { type: string }
        digest: { type: string }
        owner: { $ref: "#/components/schemas/Owner" }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: |
            Severity counts from the scan provider. All zero when
            `provider_assessed` is false, which means absent data.
        risk: { type: number }
        actionable: { type: boolean }
        suppressed: { type: boolean }
        priority: { type: string }
        reasons:
          type: array
          items: { type: string }
          description: Which rules produced this verdict.
        rule:
          type: string
          description: >-
            The policy rule that decided this finding, by the name it has in your own
            config. Absent when no rule matched.
        rule_kind:
          type: string
          enum: [actionable, suppress, none]
          description: |
            Which list the rule came from. `none` is a verdict, not missing data:
            policy has no opinion about this finding, so it is neither queued work nor
            an accepted risk.
        exposure:
          type: string
          enum: [public, internal, unknown]
          description: |
            Reachability from the internet, where something reports it. `unknown` is a
            real answer and must not be read as `internal`: a fleet whose provider does
            not report reachability would otherwise look entirely internal.
        signals:
          type: array
          items:
            type: string
            enum: [exposed, kev, in-flight, stale-fix, unassessed, suppressed]
          description: |
            The notable facts about this finding. Each is a positive statement, so the
            absence of one asserts nothing — no `exposed` covers both an internal
            workload and one whose reachability nobody reported.
        workload_count: { type: integer }
        fixable_critical:
          type: integer
          description: Critical CVEs with a fix available. Needs a vuln source.
        known_exploited: { type: boolean }
        vuln_count:
          type: integer
          description: >-
            CVEs on this image. Present so a caller can pass `vulns=false` and still
            know the size of the problem; absent means none are listed, which for an
            unscanned image means unknown rather than none - read `scanned`.
        top_epss:
          type: number
          description: >-
            Highest EPSS across this image's CVEs: one CVE at 0.93 makes the image
            urgent however many quiet ones sit beside it.
        top_epss_percentile:
          type: number
          description: >-
            The percentile of that same CVE, not the highest percentile on the image -
            pairing a score with another CVE's ranking would describe neither.
        top_risk_score:
          type: number
          description: >-
            Highest provider risk score across this image's CVEs, on the provider's own
            scale. Not comparable with EPSS, which is a probability.
        provider_assessed:
          type: boolean
          description: False means the provider never assessed this image.
        assessment_issues:
          type: array
          items: { type: string }
          description: |
            The provider's own reasons for not assessing it, most common first, when
            it gives them.
        scanned: { type: boolean }
        exploit_checked: { type: boolean }
        scan_error: { type: string }
        counts_source:
          type: string
          description: |
            Who produced `counts`. Absent means the scan provider. Present names the
            fallback scanner that supplied them because the provider never assessed
            the image.

            A client totalling counts across findings MUST read this: the provider's
            "critical" and a fallback scanner's "critical" come from different vendor
            feeds, so a sum over a mixed set blends two severity scales.
        fallback_source:
          type: string
          description: >-
            The fallback source asked about this image. Absent means it was never
            asked — no fallback configured, or the image was skipped by scan policy.
        fallback_scanned:
          type: boolean
          description: |
            True when the fallback scanner supplied this finding's data.
            `provider_assessed` stays false either way: the provider not looking is a
            coverage gap the fallback compensates for, not one it closes.
        fallback_error:
          type: string
          description: >-
            Why the fallback could not read this image. Present means nothing has any
            data for it — the residual coverage gap.
        oldest_cve_days:
          type: integer
          description: |
            Days since the scan provider first saw the oldest CVE on this image.
            Absent when no CVE is dated — no age source ran, or the provider has never
            seen them. Absent and zero are different answers.
        oldest_cve_first_seen: { type: string, format: date-time }
        remediation_checked:
          type: boolean
          description: |
            False means upgrade detection did not run. A consumer that skips findings
            without an upgrade must check this, or it silently skips images whose
            versions merely could not be resolved.
        upgrade: { $ref: "#/components/schemas/Upgrade" }
        base_diff: { $ref: "#/components/schemas/BaseDiff" }
        build_repo:
          type: string
          description: >-
            The source repository that built this image, from the labels named by
            `remediation.base.repoLabels`. Absent means the image records none - so
            nothing can point at the code that produced it, which is a real answer rather
            than a gap. The keys are configuration because they belong to the CI system:
            the OCI standard key names a project's source, while a CI system usually
            writes the repository that ran the build, and only the second answers "would
            a pull request here rebuild this image".
        image_built:
          type: string
          format: date-time
          description: |
            When the image was built, per its own config.

            Absent when the image records none, or when it was not read - only
            first-party images are, since a vendor's build date is the vendor's
            business and nobody here can act on it. Absent is never zero: an unread
            image dated to the epoch would sort to the top of any "oldest first"
            ordering.
        image_age_days:
          type: integer
          description: |
            How long ago that was. Most of a queue is not neglect - an image drifts
            because nothing rebuilt it - so this separates "you ignored this" from
            "this has not shipped since March", which are different conversations.
        in_flight: { $ref: "#/components/schemas/InFlight" }
        in_flight_reason:
          type: string
          description: |
            Why this image can never be matched to a pull request — it records no build
            repository label. Distinct from an absent `in_flight` with no reason, which
            means the repository was known and no pull request was found: the first is a
            build pipeline fix, the second is work nobody has started.
        in_flight_checked:
          type: boolean
          description: |
            False means in-flight detection did not run, so an absent `in_flight` says
            nothing about whether remediation has been started.
        liveness:
          type: object
          description: Present only when reconciliation ran.
          properties:
            live: { type: boolean }
        dimensions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        labels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        vulns:
          type: array
          items: { $ref: "#/components/schemas/Vulnerability" }

    InFlight:
      type: object
      description: |
        An open pull request that would apply this finding's upgrade, in the
        repository that builds the image. Absent means no pull request was matched,
        which includes in-flight detection not running at all: absence is not
        evidence that nobody is working on it.
      required: [repository, title, opened, open_days, exact]
      properties:
        repository:
          type: string
          description: The repository the pull request is in, which is the one that builds this image.
        title: { type: string }
        url: { type: string }
        author: { type: string }
        opened: { type: string, format: date-time }
        open_days: { type: integer }
        stale:
          type: boolean
          description: |
            Open past the configured threshold (remediation.inFlight.staleAfterDays):
            a fix nobody has merged, rather than progress.
        exact:
          type: boolean
          description: |
            False when the pull request bumps this dependency to a different version
            than the one recommended. A non-exact match must not be read as this
            upgrade being applied.

    Item:
      type: object
      description: "One piece of work: a service, its owner, and the upgrade it needs."
      required: [key, repository, priority, deployments, assessed_images, exposure, in_flight_checked, tags, images]
      properties:
        key: { type: string, description: "Stable identity: owner, service and target." }
        repository: { type: string }
        team: { type: string }
        class: { type: string }
        priority: { type: string }
        priority_where:
          type: string
          description: |
            Where the worst verdict came from. The same image is often urgent in
            production and medium in development; without this the distinction the
            policy drew is lost.
        rule: { type: string, description: The policy rule behind the verdict. }
        upgrade: { $ref: "#/components/schemas/Upgrade" }
        critical: { type: integer }
        high: { type: integer }
        deployments: { type: integer }
        assessed_images:
          type: integer
          description: |
            How many of the item's images the provider assessed. Short of `deployments`
            means `critical` and `high` are the worst KNOWN rather than the worst.
        scanned_images: { type: integer }
        exposure: { type: string, enum: [public, internal, unknown] }
        signals:
          type: array
          items: { type: string }
        in_flight: { $ref: "#/components/schemas/InFlight" }
        in_flight_checked:
          type: boolean
          description: True only when every deployment in the item was checked.
        tags:
          type: array
          items: { type: string }
        accounts:
          type: array
          items: { type: string }
        namespaces:
          type: array
          items: { type: string }
        images:
          type: array
          items: { type: string }
          description: Full references, so a consumer can fetch any deployment's finding.
        workloads: { type: integer }

    CVE:
      type: object
      description: One vulnerability across the estate.
      required: [id, severity, kev, images, services, fixable, scanned_images, total_images]
      properties:
        id: { type: string }
        severity:
          type: string
          description: The worst severity reported anywhere; distros rate the same CVE differently.
        cvss: { type: number }
        epss:
          type: number
          description: Absent means no exploit source ran, not a low score.
        risk_score: { type: number, description: The scan provider's own scale, not comparable with epss. }
        kev: { type: boolean }
        images: { type: integer, description: Deployments carrying it. }
        services: { type: integer, description: Pieces of work fixing it takes. }
        fixable: { type: integer, description: Affected images with a published fix. }
        teams:
          type: array
          items: { type: string }
        fixed_versions:
          type: array
          items: { type: string }
        affected:
          type: array
          description: Present on the single-CVE endpoint only.
          items:
            type: object
            properties:
              image: { type: string }
              repository: { type: string }
              team: { type: string }
              fixed_version: { type: string, description: Empty means no fix published for this image. }
              fix_path: { type: string, enum: [direct, managed, none, unknown, unchecked] }
              priority: { type: string }
              accounts:
                type: array
                items: { type: string }
        scanned_images: { type: integer }
        total_images: { type: integer }

    Owner:
      type: object
      properties:
        class: { type: string }
        team: { type: string }
        rule: { type: string, description: The ownership rule that matched. }

    Support:
      type: object
      required: [product, cycle, supported, known]
      description: |
        Whether the line an image is built on is still maintained. ABSENT means it was not
        checked - no support source ran, or the base image is not one the source
        recognises - which is not the same as supported and must not be rendered as such.
      properties:
        product: { type: string, description: "endoflife.date product, e.g. nodejs" }
        cycle: { type: string, description: "The line this image is on, e.g. 20" }
        eol:
          type: string
          description: When maintenance ends or ended, when a date was given.
        supported:
          type: boolean
          description: The verdict, meaningful only when `known` is true.
        known:
          type: boolean
          description: |
            Whether the source had a verdict to give. False means it did not: render that
            as unchecked, never as supported.
        recommended:
          type: string
          description: |
            The newest line adoptable today: maintained, and already long-term supported
            where the product designates LTS at all. Deliberately not the newest line
            that exists, which is frequently one nobody should adopt yet.
        nearest:
          type: string
          description: The smallest supported move, for when the recommendation is too far to plan.
        newest:
          type: string
          description: The newest line that exists, named but not recommended.
        source:
          type: string
          description: Who said so. An unattributed claim invites an argument rather than a rebuild.

    Upgrade:
      type: object
      required: [kind, current, available, resolved, actionable]
      properties:
        kind: { type: string, description: "e.g. image, chart" }
        name: { type: string }
        current: { type: string }
        latest:
          type: string
          description: >-
            The version to move TO, set only when `available` is true. A source already on
            the newest version it can see reports no `latest`: a consumer reading this
            field without checking `available` would otherwise render a no-op move such as
            "1.11.0 -> 1.11.0" and send somebody to raise a pull request that changes
            nothing, when the real answer is that the fix is not a bump.
        available: { type: boolean }
        resolved:
          type: boolean
          description: |
            False means versions could not be resolved, so "no upgrade available" is
            unproven.
        reason:
          type: string
          description: |
            Why an upgrade could not be determined, in terms a reader can act on — an
            unreadable registry and an image that records no base need different people
            to do different things.
        newest:
          type: string
          description: |
            The furthest version available when the recommendation is nearer. Absent
            when they are the same. Reported so a consumer can offer both — the patch
            to take now, and the migration to plan — rather than choosing for the
            reader.
        strategy:
          type: string
          enum: [patch, minor, latest]
          description: How far the recommendation was allowed to move.
        ceiling:
          type: string
          description: A version prefix policy will not recommend beyond, e.g. "3.12".
        ceiling_reason: { type: string }
        ceiling_expired:
          type: boolean
          description: |
            The ceiling's end date has passed, so it was NOT applied. A constraint with
            no end date becomes permanent by accident; this surfaces one due a revisit.
        held_back:
          type: boolean
          description: |
            Newer versions exist and policy recommends none of them. Distinct from
            having no upgrade at all, which is what an absent upgrade would imply.
        rule:
          type: string
          description: |
            The upgrade rule that decided this, when one did. Rules can be scoped to
            particular services, so "why am I held here" is no longer answerable from
            the config alone - and a restrained recommendation would otherwise be
            indistinguishable from an exhausted one.
        out_of_track:
          type: boolean
          description: |
            The recommendation leaves the current major or minor line, because that line
            is no longer maintained and staying on it has no upgrade path at all. A
            migration rather than a bump, which is a different kind of work.
        support:
          $ref: "#/components/schemas/Support"
        comparison:
          type: string
          enum: [version, digest]
          description: |
            How the verdict was reached. `digest` means the reference is a floating tag
            with no version, so `current` and `latest` are short digests rather than
            versions.
        actionable:
          type: boolean
          description: True only when applicable at this level.
        managed:
          type: string
          description: What owns the version, when something else does.
        manager: { type: string }
        source: { type: string }
        source_path: { type: string }

    Vulnerability:
      type: object
      required: [id, severity, fix_available]
      properties:
        id: { type: string }
        severity: { type: string }
        first_seen:
          type: string
          format: date-time
          description: |
            When the scan provider first observed this CVE, estate-wide. Needs an age
            source; absent when unknown.
        cvss: { type: number }
        fix_available: { type: boolean }
        fixed_version: { type: string }
        risk_score:
          type: number
          description: |
            The scan provider's own composite ranking for this CVE, on that provider's
            scale (Rapid7's runs to roughly 1000). NOT comparable with `epss`, which is
            a probability between 0 and 1. Absent means unscored.
        exploit_known:
          type: boolean
          description: |
            The provider has a public exploit on record. Weaker evidence than `kev`,
            which is confirmed exploitation in the wild.
        epss:
          type: number
          description: Probability of exploitation in 30 days. Needs an exploit source.
        epss_percentile:
          type: number
          description: |
            Where that probability ranks against every scored CVE, 0..1. Reported
            because the score alone misleads: nearly every CVE scores near zero, so
            0.08 reads as negligible when it is in fact the 94th percentile.

            Absent when no exploit source ran, or when the feed carried no percentile
            for this CVE.
        kev: { type: boolean, description: CISA Known Exploited Vulnerabilities. }
        origin:
          type: string
          enum: [base, app]
          description: |
            Where this CVE came from, established by scanning the base image rather
            than inferred from a package name. `base` means the base image as built
            already contained it, so the application team did not introduce it and
            mostly cannot fix it in their own repository. `app` means the image has it
            and its base does not, so the Dockerfile installed it.

            Absent means no base scan was available. That is NOT `app`: "we did not
            look" and "we looked and it is yours" send work to different people.
        fixed_by_upgrade:
          type: boolean
          description: |
            The base image being recommended does not contain this CVE, so rebuilding
            on it removes this one. Only meaningful with `origin_determined` true.
        origin_determined:
          type: boolean
          description: |
            A candidate base image was actually scanned. When false, `fixed_by_upgrade`
            is absent because the question was not asked, which must not be read as
            "this upgrade will not fix it".
        packages:
          type: array
          items: { $ref: "#/components/schemas/AffectedPackage" }
          description: |
            The packages carrying this CVE in the base image, and the version that
            fixes each. Measured by scanning the base, so the name and the version
            come from the same pass and always belong to the same ecosystem.

            Absent for `origin: app`: those packages live in a layer nothing scanned.
            Absent is "nothing measured", not "no package involved" — the provider's
            own per-CVE package field is NOT used here, because 66% of its entries
            name an ecosystem the image does not contain.

    AffectedPackage:
      type: object
      required: [name]
      properties:
        name: { type: string, description: The package as the scanner names it. }
        ecosystem:
          type: string
          description: debian, ubuntu, alpine, azurelinux, redhat, gobinary, dotnet-core, ...
        fixed_in:
          type: string
          description: |
            The version fixing this CVE for this package, from the same scan as the
            name. Absent when the scanner knows of no fix.

    BaseDiff:
      type: object
      required: [from_ref, total, from_base, from_app, clears, leaves, introduces, determined]
      description: |
        What scanning this image's base image established: how much of its
        vulnerability count the base accounts for, and how much of that a specific
        base upgrade would remove.

        Absent when the differential did not run for this image — no resolvable base,
        or its scan failed. Absent is not "the base accounts for nothing".
      properties:
        from_ref:
          type: string
          description: |
            The base as built, digest-pinned whenever the build recorded one, so the
            comparison describes what the image was actually built on rather than
            whatever the tag points at now.
        to_ref:
          type: string
          description: |
            The base compared against. Absent when none was — either the base is
            current, or the recommendation belongs to a deeper link in the base chain,
            where diffing this pair would attribute the intermediate base's packages
            to the application.
        os_family:
          type: string
          description: The distro the base scan identified (debian, alpine, azurelinux, redhat).
        total: { type: integer, description: CVEs considered. }
        from_base: { type: integer, description: Present in the base as built. }
        from_app:
          type: integer
          description: In the image but not in its base, so the application team owns them.
        unknown: { type: integer, description: Not attributed. }
        clears: { type: integer, description: Removed by moving to `to_ref`. }
        leaves: { type: integer, description: From the base and still present in `to_ref`. }
        introduces:
          type: integer
          description: |
            In `to_ref` but not in the base as built. Reported because an upgrade that
            fixes 3,664 and adds 40 is still worth taking, and stating only the first
            half is how a recommendation stops being trusted.
        determined:
          type: boolean
          description: |
            A candidate base was scanned. When false, `clears` and `leaves` are zero
            because the question was not asked, not because the answer is nothing.

    Analytics:
      type: object
      required: [wins, issues, teams, estate, age_bucket_order, notes, stale_fix_days]
      properties:
        wins:
          type: array
          items: { $ref: "#/components/schemas/Win" }
          description: |
            Base upgrades ranked by the CVEs they remove across every image on that
            base, biggest first. Most of the leverage in an estate is here rather than
            per-team: one rebuild fixes everything built on that base.
        issues:
          type: array
          items: { $ref: "#/components/schemas/Issue" }
          description: |
            Classes of problem nobody is acting on, worst first. Grouped by what the
            problem IS rather than by owner, because each needs a different response.
            Empty categories are omitted.
        teams:
          type: array
          items: { $ref: "#/components/schemas/TeamAnalytics" }
          description: |
            One row per owner, worst first: fixes nobody has started, then age, then
            size. The top row is the one worth a conversation.
        estate:
          allOf: [{ $ref: "#/components/schemas/TeamAnalytics" }]
          description: The same shape summed over every team, so a row can be read against the whole.
        age_bucket_order:
          type: array
          items: { type: string }
          description: The age bands in order, since the map keys do not sort as strings.
        notes:
          type: array
          items: { type: string }
          description: |
            Questions this endpoint is asked that the data cannot answer. Carried in the
            payload rather than only on the page: a consumer building its own dashboard
            needs to know what is missing as much as the page does.
        stale_fix_days:
          type: integer
          description: The threshold behind stale_unstarted, so a reader knows what "stale" meant.

    Win:
      type: object
      required: [from_ref, to_ref, images, teams, clears, total, introduces]
      properties:
        from_ref: { type: string, description: The base as built, digest-pinned where known. }
        to_ref: { type: string, description: The base this would move to. }
        images:
          type: integer
          description: |
            Distinct images on this base. Counted per IMAGE, not per finding: one image
            owned by three teams is one rebuild.
        teams: { type: integer, description: How many owners those images span. }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceCount" }
          description: |
            The services on this base, so the rebuild can be scoped rather than guessed
            at. Grouped by service because one service appears at several tags at once,
            and the rebuild is per service.
        clears: { type: integer, description: CVEs the move removes across those images. }
        total: { type: integer, description: CVEs those images carry. }
        introduces:
          type: integer
          description: |
            CVEs the new base brings with it. Always reported: an upgrade described only
            by what it fixes stops being trusted the first time somebody checks.
        kev_cleared: { type: integer, description: Known-exploited CVEs among the cleared. }

    Issue:
      type: object
      required: [key, title, count, why, teams]
      properties:
        key:
          type: string
          description: Stable identifier for the category, for alerting on a specific one.
          enum: [kev-unstarted, kev-no-fix, stale-fix, eol-base, pr-stale, unassessed]
        title: { type: string }
        count: { type: integer }
        why:
          type: string
          description: What to do about it. A bare count is left to interpretation.
        teams: { type: integer, description: How many owners the issue spans. }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceCount" }
          description: |
            Every affected service, not a sample: a count somebody cannot expand is a
            number they have to take on trust. Grouped by service rather than by image
            reference, since one service is typically present at an rc, a preview and a
            release simultaneously.

    ServiceCount:
      type: object
      required: [service, images]
      properties:
        service:
          type: string
          description: The image repository, which is what a team owns and rebuilds.
        images:
          type: integer
          description: How many distinct image versions of it are affected.
        team: { type: string, description: The owner, when one was attributed. }

    TeamAnalytics:
      type: object
      required: [class, team, findings, actionable]
      properties:
        class: { type: string }
        team: { type: string, description: Empty when no ownership rule attributed the workloads. }
        findings: { type: integer }
        actionable: { type: integer }
        median_age_days:
          type: integer
          nullable: true
          description: |
            Over actionable findings, dated from each one's OLDEST CVE: an image
            carrying something since June has been exposed since June, whatever
            arrived later. Null when nothing here is dated, which happens without an
            age source and is NOT the same as new.
        p90_age_days: { type: integer, nullable: true, description: As median_age_days, at the 90th percentile. }
        age_buckets:
          type: object
          additionalProperties: { type: integer }
          description: Actionable findings by age band, keyed by the labels in age_bucket_order.
        fixable: { type: integer, description: Actionable findings with an upgrade available. }
        unstarted:
          type: integer
          description: Of those, the ones with no open pull request and no open ticket.
        stale_unstarted:
          type: integer
          description: |
            Unstarted findings older than stale_fix_days. The sharpest single signal
            here. Counted only where the age is KNOWN: without an age source an
            unstarted fix is not evidence of anything.
        in_flight: { type: integer, description: Findings with an open pull request applying the upgrade. }
        in_flight_stale: { type: integer, description: Of those, open past the configured threshold. }
        in_flight_median_days:
          type: integer
          nullable: true
          description: |
            How long those pull requests have been open. A high in_flight with a high
            median is a review bottleneck, not an engagement problem, and the two need
            different conversations.
        tickets_open: { type: integer }
        tickets_untouched:
          type: integer
          description: Open tickets still in the tracker's "new" category - raised and not picked up.
        kev: { type: integer, description: Findings carrying a known-exploited CVE. }
        kev_fixable:
          type: integer
          description: Of those, the ones with an upgrade available. The gap is what gets escalated.
        epss_high:
          type: integer
          description: |
            Findings carrying a CVE at or above the urgency threshold (EPSS 0.5).
        top_epss:
          type: number
          description: The highest exploitation probability this owner holds, 0..1.
        top_epss_percentile:
          type: number
          description: |
            Where that score ranks against every scored CVE, 0..1. Both are reported
            because either alone misleads: a high percentile with a low score is a
            crowded field rather than a real threat.
        base_clears:
          type: integer
          description: CVEs a base rebuild would remove across this team's images.
        base_total:
          type: integer
          description: |
            CVEs those images carry. The ratio says how much of a team's queue is not
            theirs to fix line by line. Zero means no base differential ran.
        unassessed:
          type: integer
          description: |
            Findings the provider never assessed. Read alongside the rest: a team can
            look responsive purely because nothing scanned its images.

    OwnerStats:
      type: object
      required: [class, team, total, actionable, fixable, upgradable, unassessed]
      properties:
        class: { type: string }
        team: { type: string }
        total: { type: integer }
        actionable: { type: integer }
        fixable:
          type: integer
          description: >-
            ACTIONABLE findings with a fix-available critical. Scoped to actionable
            because it is reported as a share of `actionable`, and a counter meant to be
            divided by another has to be drawn from the same set.
        upgradable:
          type: integer
          description: >-
            Findings with an actionable upgrade, across ALL findings in the row -
            "actionable" here describes the upgrade, not the finding. Not a share of
            anything, and must not be divided by `actionable`.
        unassessed: { type: integer }
        direct: { type: integer, description: Actionable findings fixable on the image. }
        managed: { type: integer, description: Actionable findings a chart or operator owns. }
        ticketed: { type: integer }
        urgent:
          type: integer
          description: >-
            Findings policy rated urgent. Counts of findings, not CVEs: a finding is
            what gets assigned and fixed, and a CVE count would let one badly-scanned
            image outrank a team's whole estate.
        known_exploited:
          type: integer
          description: >-
            Findings carrying a CVE in CISA's Known Exploited Vulnerabilities
            catalogue: confirmed exploitation, not a prediction.
        exposed:
          type: integer
          description: Findings on workloads something reported reachable from the internet.
        end_of_life:
          type: integer
          description: >-
            Findings built on a line nobody maintains, so no future fix reaches them.
            Reported separately from the rest because every other count here falls when
            somebody rebuilds; this one falls only when somebody migrates.
        cves:
          type: object
          additionalProperties: { type: integer }
          description: Provider severity counts summed across assessed findings.
        cves_from:
          type: integer
          description: |
            How many findings contributed to `cves`. Zero means no CVE data at all,
            not no CVEs.

    Summary:
      type: object
      properties:
        findings: { type: integer }
        actionable: { type: integer }
        suppressed: { type: integer }
        known_exploited: { type: integer }
        end_of_life:
          type: integer
          description: >-
            Findings built on a line nobody maintains, so no future fix reaches them.
            Reported beside known_exploited because those are the two facts a security
            reviewer reads first, and they decay differently: an exploited CVE is closed
            by a rebuild, an end-of-life base only by a migration.
        upgradable:
          type: integer
          description: >-
            Findings with an actionable upgrade, across ALL findings in the row -
            "actionable" here describes the upgrade, not the finding. Not a share of
            anything, and must not be divided by `actionable`.
        unique_images: { type: integer }
        provider_assessed: { type: integer }
        provider_unassessed: { type: integer }
        remediation_unresolved: { type: integer }
        actionable_unassessed:
          type: integer
          description: |
            Actionable findings on images the provider never assessed — actionable
            only because a scanner looked where the provider did not.
        fallback_scanned:
          type: integer
          description: >-
            Provider-unassessed findings a fallback scanner supplied counts for.
        fallback_failed:
          type: integer
          description: >-
            Provider-unassessed findings the fallback was asked about and could not
            read.
        uncovered:
          type: integer
          description: |
            Provider-unassessed findings with no data from anybody: the fallback
            failed, or was never asked. This is the residual gap and the number worth
            an alert threshold.

            `provider_unassessed` keeps counting all of them. A fallback working is
            not the provider working, and a dashboard that stopped saying so would let
            a scan provider quietly stop covering the estate.
        scanned: { type: integer }
        exploit_checked: { type: integer }
        in_flight:
          type: integer
          description: |
            Findings whose upgrade has an open pull request in the repository that
            builds the image, matched on dependency and target version.
        in_flight_possible:
          type: integer
          description: |
            Weaker matches: a pull request bumping the same dependency to a different
            version. Somebody working nearby, not this fix.
        in_flight_stale:
          type: integer
          description: Matched pull requests open past the configured threshold.
        exposed:
          type: integer
          description: Findings on a workload reachable from the internet.
        exposure_unknown:
          type: integer
          description: |
            Findings where nothing reported reachability. Published because a fleet with
            no exposure data would otherwise look entirely internal.
        in_flight_unmatchable:
          type: integer
          description: |
            Findings that can never be matched to a pull request, because their image
            records no build repository. A build pipeline gap rather than an absence of
            remediation.
        in_flight_checked:
          type: integer
          description: |
            Findings where in-flight detection ran. Zero means it did not, so zero
            matches says nothing about whether remediation has been started.
        provider_data_newest:
          type: string
          format: date-time
          description: |
            Newest assessment timestamp in the provider's own data, which is not the
            same as when this pipeline ran.
        provider_data_oldest: { type: string, format: date-time }
        remediation_blockers:
          description: |
            Findings whose upgrade could not be resolved, grouped by the stated reason,
            worst first. Without it, a remediation source losing access looks identical
            to an estate with nothing to fix — the queue simply stops offering upgrades.
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              findings: { type: integer }
        source_failures:
          type: array
          description: |
            Enrichments that could not run — exploit intelligence, CVE ages. The
            assessment is still served: losing an enrichment must not lose the queue. But
            the gap is reported rather than left to be inferred from cells reading "not
            checked" for no visible reason, because a missing signal looks exactly like a
            signal that found nothing.
          items:
            type: object
            required: [stage, error]
            properties:
              stage: { type: string, enum: [exploit, age] }
              error: { type: string }
        expired_suppressions:
          description: |
            Suppress rules that have lapsed, so the work they were hiding is back in
            the queue. Reported because an unexplained jump in the queue reads as the
            estate getting worse rather than as a policy decision expiring.
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              until: { type: string, description: "The date it lapsed, YYYY-MM-DD." }
        unassessed_reasons:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              findings: { type: integer }
        fallback_failures:
          description: |
            Findings the fallback could not cover, by the reason it failed, worst
            first. The same argument as `unassessed_reasons` one layer down: a safety
            net that cannot authenticate to the registry the provider could not
            authenticate to either is one credential, not a coverage statistic.
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
              findings: { type: integer }

    TicketRef:
      type: object
      properties:
        key: { type: string }
        status: { type: string }
        url: { type: string }

    TicketPlan:
      type: object
      required: [assessment, applied, actions]
      properties:
        assessment: { $ref: "#/components/schemas/AssessmentMeta" }
        applied:
          type: boolean
          description: Whether this response describes writes that were made.
        auto_apply:
          type: boolean
          description: |
            Whether a scheduled refresh will apply this plan. "Three pending writes"
            reads very differently if they land within the hour or never.
        actions:
          type: array
          items: { $ref: "#/components/schemas/TicketAction" }

    TicketAction:
      type: object
      required: [kind, why]
      properties:
        kind:
          type: string
          enum: [create, extend, update, close, note-stale, note-done, skip]
        why: { type: string }
        ticket: { type: string }
        summary: { type: string }
        route:
          type: string
          description: The routing rule that chose the tracker.
        url:
          type: string
          description: |
            Browse link for an existing ticket. Absent for a creation, and when the
            Jira base URL is unknown — a broken link is worse than none.
        images:
          type: array
          items: { type: string }
        comment: { type: string }
        error:
          type: string
          description: Set on an applied action that failed; others may have succeeded.
