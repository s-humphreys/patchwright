# Policy rules decide what is actionable. Expressions are CEL, evaluated over
# the finding context (one image, one owner, aggregated across its workloads):
#
#   image      map<string,string>        registry, repository, tag, digest, ref
#   counts     map<string,int>           critical, high, medium, low (always present)
#   risk       double                    representative risk score
#   owner      map<string,string>        class, team
#   dimensions map<string,list<string>>  union of values across workloads
#   labels     map<string,list<string>>  union of label values across workloads
#   vulns      list<map>                  per-CVE detail when available:
#                                         id, severity, cvss, fix_available, fixed_version
#
# Suppression is evaluated first and wins over actionability. Among actionable
# rules the FIRST match wins and sets the priority. Everything here is an
# EXAMPLE — edit to fit your org's SLAs and risk appetite.

# Vulnerability scanning (--vuln-source). Skip scanning images you can't
# remediate — they're suppressed below anyway, so scanning them just wastes time.
# Unset defaults to [cloud-provider]; set to [] to scan every image.
#
# skipRegistries additionally skips whole registries regardless of owner — use
# it for private registries you have no pull credentials for, where every scan
# would fail anyway. Unset means scan every registry.
scan:
  skipOwnerClasses: [cloud-provider]
  # skipRegistries: [acme.azurecr.io]

# Ticket creation (`patchwright ticket`). See the README; credentials come from
# the environment, never from this file.
#
# jira:
#   # The wording every route uses unless it names its own. Everything a template
#   # can say is documented on ticket.TemplateData.
#   defaultTicketTemplate: config/templates/container-vuln.md.tmpl
#   issueType: Container Vulnerability
#   priority: Medium        # fallback for anything a route's priorityMap misses
#
#   # Keep findings out of ticket creation without hiding them. Unlike suppress
#   # below, an excluded finding stays in the assessment and the queue and is
#   # reported as skipped with the reason — it is work tracked somewhere else,
#   # not work nobody should do. `when` is CEL over the same variables as the
#   # rules below.
#   exclude:
#     - name: managed-elsewhere
#       when: "dimensions['namespace'].exists(n, n == 'some-system')"
#       reason: upgraded together on their own cadence
#
#   # Routes are where a tracker is described, so at least one is required. A
#   # project key, a board, an image field and a priority scheme mean nothing
#   # except in the context of the board they belong to, which is why they are
#   # here rather than above: a deployment serving two teams has two of each.
#   #
#   # First match wins. A finding matching no route gets no ticket, and is
#   # reported as a skip naming its owner, so unrouted work is visible rather
#   # than silently landing on somebody else's board.
#   #
#   # A group of findings is never split across routes: two findings sharing one
#   # upgrade but owned by different teams become two tickets, because one issue
#   # cannot exist in two projects.
#   # Close a ticket when its work is provably finished: every image it covers is
#   # still reported, was checked for a newer version, and is already on the latest
#   # one, with live reconciliation having run. For the common case where someone
#   # merges a Renovate PR, rolls it out, and never sees the ticket.
#   #
#   # Off by default. Note this closes on positive evidence only — a finding merely
#   # disappearing is never treated as done, because a provider that stopped
#   # assessing an image looks identical.
#   # Both are per route as well as here, since they belong to the tracker: see
#   # routes below. For existing tickets they resolve by the issue key's project.
#   autoClose: true
#   closeTransition: Done   # required when the workflow has several ways to finish
#   # For boards where Done is only reachable once a ticket has been started, so a
#   # ticket nobody picked up can only be abandoned. Applies to unworked tickets
#   # only; one somebody worked still fails rather than being recorded as not-done.
#   closeTransitionUnworked: Won't Do
#   # Clear the priority when closing that way: a not-worked ticket at Highest keeps
#   # appearing in priority-ordered views. Only on that path — completed work keeps
#   # the priority it was triaged at.
#   closePriorityUnworked: Lowest
#
#   # Lowest assessment priority worth a ticket. The queue can hold a hundred low
#   # findings usefully; a tracker holding a hundred nobody will action becomes one
#   # people stop reading. Below-threshold findings are reported as skipped, not
#   # hidden. Per route as well as here.
#   minPriority: high
#
#   routes:
#     - name: sre
#       when: "owner['team'] == 'sre'"
#       project: SRE
#       board: 42
#       issueType: Bug            # overrides the deployment-wide setting above
#       epic: SRE-42
#       autoClose: true
#       closeTransition: Ship It  # this project's workflow, not another's
#       # A team-managed project with no shared custom field can key on labels
#       # instead; the lookup follows automatically.
#       imageLabel: true
#       # This team writes its own tickets differently. Omit to use
#       # defaultTicketTemplate above.
#       template: config/templates/sre.md.tmpl
#       priorityMap:
#         urgent: Blocker
#         high: Major
#     - name: platform
#       when: "owner['class'] == 'platform'"
#       project: PROJ
#       board: 100
#       epic: PROJ-100
#       imageField: customfield_XXXXX
#       # Carries the assessment's ordering into Jira. Without a map every ticket
#       # is raised at `priority` and the tracker cannot tell an urgent,
#       # exploited, fixable finding from a low one. Not defaulted: priority
#       # schemes belong to a project, and a name that does not exist fails
#       # ticket creation.
#       priorityMap:
#         urgent: Highest
#         high: High
#         medium: Medium
#         low: Low

# Remediation tuning. Optional; without it every image is treated as third-party.
#
# remediation:
#   # Registries whose images you build yourself. For those, a newer tag of your own
#   # image is a release number rather than a fix — the CVEs are in the base image — so
#   # the tag source stays quiet and the base image becomes the remediation path.
#   firstPartyRegistries: [registry.example.com]
#   base:
#     # Config labels that may hold the base reference, in preference order. Defaults
#     # to the OCI standard key then BuildKit's, which covers most builders.
#     refLabels:
#       - org.opencontainers.image.base.name
#       - image.base.ref.name
#     digestLabels:
#       - org.opencontainers.image.base.digest
#       - image.base.digest
#     # How far to follow a chain of first-party bases. Defaults to 4; the walk always
#     # stops at the first base that is not first-party.
#     maxDepth: 4

suppress:
  # An `until: YYYY-MM-DD` on any suppress rule makes it expire. After that date the
  # rule stops matching and the findings it was hiding return to the queue, with a
  # warning naming the rule. Accepted risk with no expiry is accepted forever: nobody
  # re-reads a config file, so a decision taken for one quarter outlives its reason.
  # Cloud-provider-managed images are not directly patchable by app or platform
  # teams; keep them out of the actionable queue (a later phase can route them
  # to a node-image-upgrade workflow instead).
  - name: cloud-provider-managed
    when: "owner['class'] == 'cloud-provider'"

  # Not actually running: when reconciliation against live clusters has run
  # (--live-source) and none of the finding's workloads are live, drop it.
  # A completed Job or scaled-to-zero workload is not worth paging anyone over.
  # This rule is inert unless reconciliation ran (reconciled is then false).
  - name: not-running
    when: "reconciled && !live"

actionable:
  # With `--vuln-source trivy`, the `vulns` list is populated with per-CVE fix
  # availability. Prefer rules that require a fix, so you only page someone when
  # there is a patch to move to. (Uncomment; keep above the coarser rules.)
  #
  # - name: fixable-production-critical
  #   when: "dimensions['account'].exists(a, a.startsWith('Production')) && vulns.exists(v, v.severity == 'critical' && v.fix_available)"
  #   priority: high

  # With `--exploit-source public`, each CVE also gets EPSS (predicted
  # exploitation probability) and KEV (CISA known-exploited). Prioritise fixable
  # criticals that are actually being exploited or likely to be.
  #
  # - name: exploited-fixable-critical
  #   when: "vulns.exists(v, v.severity == 'critical' && v.fix_available && (v.kev || v.epss > 0.5))"
  #   priority: urgent
  #
  # "urgent" outranks "high" in report ordering. Only urgent/high/medium/low are
  # ranked; any other label sorts last, so add new tiers to priorityRank too.

  # Anything with a critical that runs in a Production account — highest stakes.
  - name: production-critical
    when: "counts['critical'] > 0 && dimensions['account'].exists(a, a.startsWith('Production'))"
    priority: high

  # Criticals in pre-production still warrant action, at lower urgency.
  - name: preproduction-critical
    when: "counts['critical'] > 0 && dimensions['account'].exists(a, a.startsWith('PreProduction'))"
    priority: medium

  # Any remaining critical (e.g. development, shared) — track it, low priority.
  - name: any-critical
    when: "counts['critical'] > 0"
    priority: low
