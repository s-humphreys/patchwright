apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "patchwright-rbac.name" . }}
  labels:
    {{- include "patchwright-rbac.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "patchwright-rbac.name" . }}
subjects:
  - kind: {{ .Values.subject.kind }}
    name: {{ include "patchwright-rbac.subjectName" . | quote }}
    {{- if eq .Values.subject.kind "ServiceAccount" }}
    namespace: {{ required "subject.namespace is required for a ServiceAccount subject: a binding without it names no account." .Values.subject.namespace }}
    {{- else }}
    apiGroup: rbac.authorization.k8s.io
    {{- end }}
