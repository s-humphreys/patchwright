{{- if and .Values.ticketing.autoTicket (not .Values.ticketing.credentialsSecretName) }}
{{- fail "ticketing.autoTicket requires ticketing.credentialsSecretName: the binary refuses to start without Jira credentials, so this would crash-loop" }}
{{- end }}
{{- if and .Values.ticketing.autoTicket (not .Values.ticketing.template) }}
{{- fail "ticketing.autoTicket requires ticketing.template: jira.template is a path and the image ships no default ticket template" }}
{{- end }}
{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchwright.fullname" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "patchwright.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "patchwright.labels" . | nindent 8 }}
        {{- if .Values.registryAuth.azure.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchwright.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        # A NUMBER, not the image's "nonroot" name. runAsNonRoot makes the kubelet
        # verify the user is not root, and it cannot verify a name — it refuses to
        # start the container with "image has non-numeric user (nonroot)". 65532 is
        # distroless nonroot, which is what this image runs as.
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- include "patchwright.container" (dict "root" . "command" "serve" "remediation" .Values.reconcile.remediation "ports" true "modeArgs" (list (printf "--addr=:%v" .Values.server.port) (printf "--interval=%s" .Values.server.interval))) | nindent 8 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- include "patchwright.volumes" (dict "root" .) | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchwright.fullname" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "patchwright.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
{{- end }}
