{{- if eq .Values.mode "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "patchwright.fullname" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "patchwright.labels" . | nindent 12 }}
            {{- if .Values.registryAuth.azure.workloadIdentity.enabled }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "patchwright.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
          containers:
            {{- include "patchwright.container" (dict "root" . "command" "assess" "remediation" .Values.reconcile.remediation "modeArgs" (list (printf "--format=%s" .Values.format))) | nindent 12 }}
          volumes:
            {{- include "patchwright.volumes" (dict "root" .) | nindent 12 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
