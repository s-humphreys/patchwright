apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "patchwright.fullname" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "patchwright.labels" . | nindent 12 }}
            {{- if .Values.registryAuth.azure.workloadIdentity.enabled }}
            # Required for Azure Workload Identity to inject the projected token.
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "patchwright.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
          containers:
            - name: patchwright
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - assess
                - "--provider={{ .Values.provider.name }}"
                - "--mode={{ .Values.provider.mode }}"
                - "--input=/data/{{ .Values.provider.input.key }}"
                - "--config=/etc/patchwright"
                - "--format={{ .Values.format }}"
                {{- if .Values.reconcile.enabled }}
                - "--live-source=kube"
                {{- if .Values.reconcile.local }}
                - "--live-option=inCluster=true"
                {{- end }}
                {{- if .Values.reconcile.remote.kubeconfigSecret }}
                - "--live-option=kubeconfig=/etc/patchwright-kubeconfig/kubeconfig"
                {{- if .Values.reconcile.remote.contexts }}
                - "--live-option=contexts={{ join "," .Values.reconcile.remote.contexts }}"
                {{- end }}
                {{- end }}
                {{- end }}
                {{- if .Values.scan.enabled }}
                - "--vuln-source={{ .Values.scan.vulnSource }}"
                {{- if .Values.scan.exploitSource }}
                - "--exploit-source={{ .Values.scan.exploitSource }}"
                {{- end }}
                {{- end }}
                {{- range .Values.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              {{- if or .Values.scan.enabled .Values.registryAuth.dockerConfigSecret }}
              env:
                {{- if .Values.scan.enabled }}
                # Trivy needs a writable cache (for its vuln DB) and temp dir,
                # since the root filesystem is read-only.
                - name: TRIVY_CACHE_DIR
                  value: /tmp/trivy-cache
                - name: TMPDIR
                  value: /tmp
                {{- end }}
                {{- if .Values.registryAuth.dockerConfigSecret }}
                # Point Trivy at the mounted docker config so it can pull private images.
                - name: DOCKER_CONFIG
                  value: /etc/patchwright-dockerconfig
                {{- end }}
              {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: rules
                  mountPath: /etc/patchwright
                  readOnly: true
                {{- if eq .Values.provider.mode "csv" }}
                - name: export
                  mountPath: /data
                  readOnly: true
                {{- end }}
                {{- if .Values.reconcile.remote.kubeconfigSecret }}
                - name: kubeconfig
                  mountPath: /etc/patchwright-kubeconfig
                  readOnly: true
                {{- end }}
                {{- if .Values.scan.enabled }}
                - name: tmp
                  mountPath: /tmp
                {{- end }}
                {{- if .Values.registryAuth.dockerConfigSecret }}
                - name: dockerconfig
                  mountPath: /etc/patchwright-dockerconfig
                  readOnly: true
                {{- end }}
          volumes:
            - name: rules
              configMap:
                name: {{ include "patchwright.fullname" . }}-rules
            {{- if eq .Values.provider.mode "csv" }}
            - name: export
              secret:
                secretName: {{ required "provider.input.secretName is required for csv mode" .Values.provider.input.secretName }}
            {{- end }}
            {{- if .Values.reconcile.remote.kubeconfigSecret }}
            - name: kubeconfig
              secret:
                secretName: {{ .Values.reconcile.remote.kubeconfigSecret }}
            {{- end }}
            {{- if .Values.scan.enabled }}
            - name: tmp
              emptyDir: {}
            {{- end }}
            {{- if .Values.registryAuth.dockerConfigSecret }}
            - name: dockerconfig
              secret:
                secretName: {{ .Values.registryAuth.dockerConfigSecret }}
                items:
                  - key: {{ .Values.registryAuth.dockerConfigKey | quote }}
                    path: config.json
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
