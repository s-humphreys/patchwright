{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchwright.serviceAccountName" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
  {{- if .Values.registryAuth.workloadIdentity.enabled }}
  annotations:
    # Azure Workload Identity: the managed identity to federate this SA to.
    # Grant that identity AcrPull on your registry.
    azure.workload.identity/client-id: {{ required "registryAuth.workloadIdentity.clientId is required when workloadIdentity is enabled" .Values.registryAuth.workloadIdentity.clientId | quote }}
    {{- with .Values.registryAuth.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
