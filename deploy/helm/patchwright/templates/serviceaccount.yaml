{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchwright.serviceAccountName" . }}
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
  {{- if or .Values.registryAuth.azure.workloadIdentity.enabled .Values.registryAuth.gcp.workloadIdentity.enabled .Values.registryAuth.aws.irsa.enabled }}
  annotations:
    {{- if .Values.registryAuth.azure.workloadIdentity.enabled }}
    # Azure Workload Identity — grant the identity AcrPull on your ACR.
    azure.workload.identity/client-id: {{ required "registryAuth.azure.workloadIdentity.clientId is required" .Values.registryAuth.azure.workloadIdentity.clientId | quote }}
    {{- with .Values.registryAuth.azure.workloadIdentity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.registryAuth.gcp.workloadIdentity.enabled }}
    # GKE Workload Identity — bind this KSA to a GSA with Artifact Registry reader.
    iam.gke.io/gcp-service-account: {{ required "registryAuth.gcp.workloadIdentity.serviceAccount is required" .Values.registryAuth.gcp.workloadIdentity.serviceAccount | quote }}
    {{- end }}
    {{- if .Values.registryAuth.aws.irsa.enabled }}
    # AWS IRSA — role with ECR read access.
    eks.amazonaws.com/role-arn: {{ required "registryAuth.aws.irsa.roleArn is required" .Values.registryAuth.aws.irsa.roleArn | quote }}
    {{- end }}
  {{- end }}
{{- end }}
