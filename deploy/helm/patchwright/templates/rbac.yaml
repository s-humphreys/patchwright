{{- if .Values.rbac.create -}}
# Minimal read-only access for live reconciliation: pods and workload definitions
# (to see what is running or deployed) and namespaces (to read ownership labels
# such as team). No write permissions, no secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "patchwright.fullname" . }}-reader
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list"]
  # Workload definitions count towards liveness as well as pods: a CronJob between
  # runs or a workload scaled to zero has no pod but is still deployed. Remediation
  # reads the same workloads to map images to their Flux HelmRelease.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  {{- if .Values.reconcile.remediation }}
  # Remediation (upgrade detection): read Flux HelmReleases/HelmRepositories to find
  # the chart. The workloads themselves are granted above for liveness.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories", "gitrepositories", "ocirepositories"]
    verbs: ["get", "list"]
  {{- if .Values.reconcile.remediationReadCRs }}
  # Deprecated: every resource in the cluster, Secrets included. Kept so existing
  # installs keep working; rbac.customResourceGroups is the scoped replacement.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]
  {{- end }}
  {{- end }}
  {{- with .Values.rbac.customResourceGroups }}
  {{- if has "*" . }}
  {{- fail "rbac.customResourceGroups contains \"*\", which grants get on every resource in the cluster - including Secrets in every namespace. Name your operators' API groups instead." }}
  {{- end }}
  # Operator-deployed images: whether the owning custom resource sets the image,
  # and which operator picks it, can only be known by reading that resource.
  - apiGroups:
      {{- toYaml . | nindent 6 }}
    resources: ["*"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "patchwright.fullname" . }}-reader
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "patchwright.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "patchwright.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
