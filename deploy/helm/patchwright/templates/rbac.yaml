{{- if .Values.rbac.create -}}
# Minimal read-only access for live reconciliation: list pods (to see what is
# running) and namespaces (to read ownership labels such as team). No write
# permissions, no secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "patchwright.fullname" . }}-reader
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "patchwright.fullname" . }}-reader
  labels:
    {{- include "patchwright.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "patchwright.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "patchwright.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
