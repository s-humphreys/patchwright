image:
  repository: ghcr.io/s-humphreys/patchwright
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# How often the assessment runs.
schedule: "0 6 * * *"
# Output format for the report (written to stdout): table, json (pretty), or
# ndjson. ndjson (one finding per line) is recommended in-cluster so log/
# monitoring pipelines parse each finding as a single record.
format: ndjson
# Structured logs (written to stderr / pod logs, separate from the report).
logLevel: info             # debug, info, warn, or error
logFormat: json            # text or json (json recommended in-cluster)
# Extra args appended to `patchwright assess`.
extraArgs: []

serviceAccount:
  create: true
  name: ""          # defaults to the release fullname

rbac:
  # Create a minimal read-only ClusterRole (list pods + namespaces) and bind it
  # to the ServiceAccount, so the job can reconcile the LOCAL cluster using only
  # its ServiceAccount token — no credentials to manage. This is the "simple
  # auth via RBAC" path.
  create: true

# Ownership and policy rules, rendered into a ConfigMap mounted at
# /etc/patchwright. These are examples — replace with your own. See the repo's
# config/ directory and README for the rule schema.
config:
  ownership: |
    owners:
      - name: cloud-provider-managed-images
        match: "image.registry in ['mcr.microsoft.com', 'registry.k8s.io']"
        class: cloud-provider
        team: azure
      - name: platform-namespaces
        match: "dimensions['namespace'] in ['flux-system','cert-manager','istio-system','gatekeeper-system']"
        class: platform
        team: platform
      - name: engineering-by-label
        match: "'team' in labels"
        class: engineering
        teamFrom: "labels['team']"
      - name: engineering-by-namespace
        match: "true"
        class: engineering
        teamFrom: "dimensions['namespace']"
  policy: |
    suppress:
      - name: cloud-provider-managed
        when: "owner['class'] == 'cloud-provider'"
      - name: not-running
        when: "reconciled && !live"
    actionable:
      - name: production-critical
        when: "counts['critical'] > 0 && dimensions['account'].exists(a, a.startsWith('Production'))"
        priority: high
      - name: any-critical
        when: "counts['critical'] > 0"
        priority: low

provider:
  name: rapid7
  mode: csv
  # The scanner export must be made available to the job as a Secret. The
  # secret's `key` is mounted read-only under /data and passed via --input.
  #
  # NOTE: until the Rapid7 API provider lands, refresh this Secret out-of-band
  # (e.g. a separate CronJob that pulls the export and updates the Secret).
  input:
    secretName: ""            # REQUIRED for csv mode, e.g. "patchwright-export"
    key: "export.csv"

reconcile:
  # Reconcile findings against live clusters (drops not-running workloads and
  # enriches ownership from namespace labels such as team).
  enabled: true
  # Read the local cluster via the pod's ServiceAccount (RBAC only).
  local: true
  # Read additional clusters via a kubeconfig Secret with read-only contexts.
  # Apply deploy/rbac/readonly-clusterrole.yaml in each remote cluster and point
  # that context's user at the bound identity.
  remote:
    kubeconfigSecret: ""      # Secret containing a "kubeconfig" key
    contexts: []              # context names to read, e.g. [aks-prod-uk, gke-analytics]
  # Detect available upgrades for how images are deployed (a newer Helm chart
  # for Flux HelmReleases, a newer image tag for manifest/Kustomize workloads).
  # Adds read access to workloads + Flux CRDs.
  remediation: false
  # Additionally grant `get` on ALL custom resources, so operator-deployed
  # images whose tag is set in the owning CR's spec are treated as directly
  # actionable (change the CR). Broad read access — leave off unless you want
  # this refinement, or replace with a scoped role for your operators' groups.
  remediationReadCRs: false

scan:
  # Scan each unique image for per-CVE fix availability (Trivy is bundled in the
  # image). Trivy pulls the images itself and downloads its vuln DB, so the job
  # needs egress to your registries and to ghcr.io/aquasecurity/trivy-db.
  # A per-image scan failure (e.g. a private image with no creds) is tolerated —
  # that finding is reported "unscanned", the run does not fail.
  enabled: false
  vulnSource: trivy
  # Also annotate CVEs with EPSS + CISA KEV (needs egress to first.org + cisa.gov).
  exploitSource: ""          # set to "public" to enable

registryAuth:
  # Credentials for Trivy to pull PRIVATE images. Use your cloud's workload
  # identity (no secrets to manage) or mount a docker config Secret. Enable at
  # most one cloud identity. Trivy resolves the rest via its native keychains.
  azure:
    # AKS + ACR. Federate the ServiceAccount to a managed identity with AcrPull.
    # The SA gets the client-id annotation AND the pod gets the required
    # `azure.workload.identity/use: "true"` label. Needs the workload-identity
    # webhook and an OIDC-enabled cluster.
    workloadIdentity:
      enabled: false
      clientId: ""           # the managed identity's client id
      tenantId: ""           # optional
  gcp:
    # GKE + Artifact Registry / GCR. Bind this KSA to a Google service account
    # with reader access (Workload Identity).
    workloadIdentity:
      enabled: false
      serviceAccount: ""     # <gsa>@<project>.iam.gserviceaccount.com
  aws:
    # EKS + ECR (IRSA). The pod-identity webhook injects credentials from the
    # annotated role.
    irsa:
      enabled: false
      roleArn: ""            # arn:aws:iam::<account>:role/<role>
  # Any registry: mount a docker config json Secret (e.g. an existing
  # imagePullSecret). Its key is mounted as config.json; DOCKER_CONFIG points at it.
  dockerConfigSecret: ""
  dockerConfigKey: ".dockerconfigjson"

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
