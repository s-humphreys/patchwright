# Credentials, in ONE Secret whose keys are the environment variables the binary reads:
#
#   RAPID7_API_KEY          the scan provider, in api mode
#   AZURE_DEVOPS_PAT        reading pull requests, for in-flight detection
#   JIRA_BASE_URL           ticketing
#   JIRA_EMAIL              ticketing
#   JIRA_API_TOKEN          ticketing
#   PATCHWRIGHT_API_TOKEN   requires a token on the API and status page
#
# Include only what you use. Every one of them is optional in the sense that matters:
# patchwright reports what it could not do rather than pretending it did, so a Secret
# holding only RAPID7_API_KEY produces an assessment with ticket state shown as unknown
# and in-flight detection reported as not run.
#
#   kubectl create secret generic patchwright \
#     --from-literal=RAPID7_API_KEY="$RAPID7_API_KEY" \
#     --from-literal=PATCHWRIGHT_API_TOKEN="$(openssl rand -base64 32)"
#
# Never in a values file: this names a Secret, it does not hold one.
credentialsSecretName: ""

image:
  repository: ghcr.io/s-humphreys/patchwright
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# patchwright runs as a long-lived Deployment (`serve`) exposing the read-only
# assessment API (findings/owners/summary), refreshed on an interval.
server:
  # Deploy the long-running server. Set false to run as a CronJob instead: one
  # assessment per schedule, written to the log, with no API and no status page.
  # Metrics need the server, since a CronJob has exited by the time anything scrapes
  # it.
  enabled: true
  # How long a first assessment may take before the rollout is called failed.
  #
  # Readiness means "an assessment is cached", so a new pod serves nothing until its
  # first run finishes — which is the point: a Service endpoint that answers with an
  # empty page is worse than one that does not answer. But it makes the rollout as long
  # as the assessment, and both Kubernetes (600s) and Helm (5m) default well below that.
  #
  # Set the Helm/Flux wait to match: spec.timeout on a HelmRelease, --timeout on helm.
  startupBudgetSeconds: 1800
  # How often the server re-runs the assessment.
  interval: 1h
  port: 8080
  service:
    type: ClusterIP
  # The API and status page require a token when the credentials Secret carries
  # PATCHWRIGHT_API_TOKEN, and are open when it does not. There is nothing to configure
  # here: the presence of the key is the decision, and a chart flag that disagreed with
  # the Secret would be a third source of truth.
  #
  # Both serve the estate's unpatched criticals to anyone who can reach the Service, so
  # leaving them open is a choice to make deliberately. A single shared token has no
  # identity and no per-team scoping; put OIDC in front for anything beyond a trusted
  # network.

# Prometheus metrics, prefixed patchwright_, served at /metrics in server mode.
#
# The endpoint is unauthenticated by default, like the health probes. A scrape config
# that needs a bearer token is friction in the place least likely to tolerate it, and
# the numbers are aggregate counts rather than the findings themselves.
#
# It is not a costless default: anything that can reach the port can read how many
# unpatched criticals the estate has and which teams have no coverage. NetworkPolicy
# is the control (see networkPolicy below). Set requireAuth to bring /metrics under
# the same token as the API, and the monitors then present it.
#
# Worth alerting on, in rough order of usefulness:
#   patchwright_provider_data_age_seconds  — the scan provider's data going stale,
#                                            which a freshly-generated report hides
#   patchwright_findings_unassessed_by_reason — coverage lost to one fixable cause
#   patchwright_jira_requests_total{outcome="auth_error"} — expired credentials
#   patchwright_assessment_runs_total{result="failure"}
metrics:
  # Require the API token on /metrics too. Needs server.auth.secretName; without a
  # token there is nothing to require, and the server says so rather than pretending.
  requireAuth: false
  # A ServiceMonitor is the default choice: server mode already has a Service.
  serviceMonitor:
    enabled: false
    # Namespace to create the object in. Empty means the release namespace, which
    # is right unless Prometheus only reads monitors from its own.
    namespace: ""
    # Extra labels, for a Prometheus whose serviceMonitorSelector requires them.
    labels: {}
    interval: 60s
    scrapeTimeout: 10s
  # For clusters whose Prometheus scrapes pods rather than services. Enabling both
  # is refused: two monitors on one target double every counter.
  podMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 60s
    scrapeTimeout: 10s

# Jira ticketing. The `jira:` block itself goes in config.policy below, with
# `template: /etc/patchwright/ticket.md.tmpl` to match the file mounted from
# ticketing.template.
ticketing:
  # Create and reconcile tickets on every scheduled refresh. Off by default: a
  # service that starts raising tickets the moment it is deployed is not a good
  # surprise, and the API endpoints work without it. Requires
  # credentialsSecretName; the chart refuses to render otherwise, matching the
  # binary, which refuses to start.
  autoTicket: false
  # Jira credentials come from credentialsSecretName (JIRA_BASE_URL, JIRA_EMAIL,
  # JIRA_API_TOKEN). Without them ticketing is off: the queue and the page are
  # unaffected, and ticket state is reported as unknown rather than as "no ticket".
  # The ticket template, mounted alongside the rules. Required for ticketing,
  # because `jira.template` is a path and the image ships no default: the wording
  # of a ticket belongs to whoever owns the process. See
  # config/templates/container-vuln.md.tmpl in the repository for a starting point.
  template: ""
# Structured logs (written to stderr / pod logs).
logLevel: info             # debug, info, warn, or error
logFormat: json            # text or json (json recommended in-cluster)
# Extra args appended to `patchwright serve`.
extraArgs: []

# The user the container runs as. The image is distroless nonroot (uid 65532), and the
# UID has to be numeric here: a cluster enforcing runAsNonRoot cannot verify a username
# and refuses to start the container at all.
podSecurityContext:
  runAsUser: 65532

serviceAccount:
  create: true
  name: ""          # defaults to the release fullname

rbac:
  # Create a minimal read-only ClusterRole (list pods + namespaces) and bind it
  # to the ServiceAccount, so the job can reconcile the LOCAL cluster using only
  # its ServiceAccount token — no credentials to manage. This is the "simple
  # auth via RBAC" path.
  create: true

# Ownership and policy rules, rendered into a ConfigMap mounted at
# /etc/patchwright. These are examples — replace with your own. See the repo's
# config/ directory and README for the rule schema.
config:
  ownership: |
    owners:
      - name: cloud-provider-managed-images
        match: "image.registry in ['mcr.microsoft.com', 'registry.k8s.io']"
        class: cloud-provider
        team: azure
      - name: platform-namespaces
        match: "dimensions['namespace'] in ['flux-system','cert-manager','istio-system','gatekeeper-system']"
        class: platform
        team: platform
      - name: engineering-by-label
        match: "'team' in labels"
        class: engineering
        teamFrom: "labels['team']"
      - name: engineering-by-namespace
        match: "true"
        class: engineering
        teamFrom: "dimensions['namespace']"
  policy: |
    suppress:
      - name: cloud-provider-managed
        when: "owner['class'] == 'cloud-provider'"
      - name: not-running
        when: "reconciled && !live"
    actionable:
      - name: production-critical
        when: "counts['critical'] > 0 && dimensions['account'].exists(a, a.startsWith('Production'))"
        priority: high
      - name: any-critical
        when: "counts['critical'] > 0"
        priority: low

provider:
  name: rapid7
  # csv reads an export someone produced; api queries InsightCloudSec directly.
  #
  # Prefer api. An export is stale the moment it is written, and a server
  # refreshing hourly over a mounted file will report a fresh assessment forever
  # while the data underneath it ages. More importantly, only the API says *why*
  # an image was not assessed, which is the difference between a coverage
  # statistic and a registry credential someone can go and fix.
  mode: csv

  # csv mode: the export is mounted read-only under /data and passed via --input.
  # Refresh the Secret out-of-band (e.g. a CronJob that pulls a fresh export).
  input:
    secretName: ""            # REQUIRED for csv mode, e.g. "patchwright-export"
    key: "export.csv"

  # api mode: your InsightCloudSec tenant, and the API key.
  #
  # The key is read from the RAPID7_API_KEY environment variable, populated from
  # a Secret you create yourself. It is never a value here: values files end up
  # in git.
  #
  #   kubectl create secret generic patchwright-rapid7 \
  #     --from-literal=apiKey="$RAPID7_API_KEY"
  api:
    baseURL: ""                       # REQUIRED for api mode, e.g. https://example.customer.divvycloud.com
    # The key comes from credentialsSecretName above (RAPID7_API_KEY).

reconcile:
  # Reconcile findings against live clusters (drops not-running workloads and
  # enriches ownership from namespace labels such as team).
  enabled: true
  # Read the local cluster via the pod's ServiceAccount (RBAC only).
  local: true
  # Read additional clusters via a kubeconfig Secret with read-only contexts.
  # Install the patchwright-rbac chart in each remote cluster
  # (oci://ghcr.io/s-humphreys/charts/patchwright-rbac) and point that context's user
  # at the identity it binds.
  remote:
    kubeconfigSecret: ""      # Secret containing a "kubeconfig" key
    contexts: []              # context names to read, e.g. [aks-prod-uk, gke-analytics]
    # How to authenticate to those clusters. Empty uses whatever credentials the
    # kubeconfig carries — a ServiceAccount token per cluster, which means minting and
    # storing a long-lived credential for every one of them.
    #
    # "azure" instead authenticates as the identity this pod already has, so the
    # kubeconfig needs to hold only each cluster's API server URL and CA certificate.
    # Nothing in it is secret and nothing in it expires. Each cluster still needs a
    # ClusterRoleBinding for that identity's object ID — see deploy/rbac.
    authMode: ""              # "" or "azure"

  # Measure whether a workload is reachable from the internet, instead of trusting
  # the scan provider's own field for it.
  #
  # Worth turning on wherever an urgency rule mentions exposure. A provider that
  # reports the same value for every workload makes such a rule look configured and
  # do nothing, and because the value is PRESENT it reads as a measurement rather
  # than as an absence.
  #
  # Reads Services and Gateway API HTTPRoutes. Adds no write access. A failure is
  # logged and skipped rather than fatal, so a role that has not caught up costs the
  # exposure data and nothing else.
  exposure:
    enabled: false
    # Which DNS suffixes reach the internet, and which do not. Most specific wins,
    # so "example.com" can be public while "internal.example.com" beneath it is not.
    #
    # This is usually the only thing in a cluster that can tell a route fronted by a
    # public load balancer from an identical one that is not: a gateway may have a
    # proxy in front of it that Kubernetes knows nothing about, and the hostname is
    # what distinguishes them.
    #
    # Leave both empty and every routed service counts as exposed, which
    # over-reports. That is the safe direction to be wrong in, but it is a poor
    # substitute for stating the domains.
    publicHostnames: []       # e.g. [example.com]
    internalHostnames: []     # e.g. [internal.example.com, cluster.local]
    # Gateways that do not reach the internet, used only when no public hostnames
    # are set. Coarser than hostnames; prefer hostnames where they exist.
    internalGateways: []      # e.g. ["gateway-system/private"]

  # Detect available upgrades for how images are deployed (a newer Helm chart
  # for Flux HelmReleases, a newer image tag for manifest/Kustomize workloads).
  # Adds read access to workloads + Flux CRDs.
  remediation: false
  # Detect remediation already under way, so an upgrade with an open pull request is
  # not reported as work nobody has started. Configured under remediation.inFlight in
  # the rules; the token comes from a Secret, never a values file.
  #
  #   kubectl create secret generic patchwright-ado --from-literal=pat="$AZURE_DEVOPS_PAT"
  #
  # In-flight detection needs AZURE_DEVOPS_PAT in credentialsSecretName. Without it the
  # queue reports "not checked" rather than "nothing in flight" — a missing token and an
  # absence of pull requests are different answers.
  # Additionally grant `get` on ALL custom resources, so operator-deployed
  # images whose tag is set in the owning CR's spec are treated as directly
  # actionable (change the CR). Broad read access — leave off unless you want
  # this refinement, or replace with a scoped role for your operators' groups.
  remediationReadCRs: false

# Whether the line each base image is built on is still maintained.
#
# Worth turning on wherever remediation is: an image pinned to a runtime's dead major
# reports "no upgrade available" forever, because nothing newer will ever be published to
# that tag. Without this, that is indistinguishable from being up to date - the same
# empty Fix column on the image that will accumulate criticals for the rest of its life.
#
# With it, the queue names the move that does exist, choosing the newest line that is both
# maintained and already long-term supported rather than the newest that exists: a
# runtime's newest major is routinely one nobody should adopt yet.
#
# Off by default because it reads an external feed (endoflife.date). When off, findings
# report support status as "not checked" rather than implying anything.
# Who may read this.
#
# The page is a map of what is exploitable across the estate, so "reachable on the
# corporate network" is not the same as "fine to leave open". Two mechanisms, and they
# coexist: a person signs in, a script presents a token.
#
# OIDC gives per-user sign-in against any compliant provider (Entra, Okta, Keycloak,
# Dex). Set the issuer to enable it. The client secret and the cookie signing key come
# from credentialsSecretName, never from here:
#
#   PATCHWRIGHT_OIDC_CLIENT_SECRET   required when an issuer is set
#   PATCHWRIGHT_SESSION_KEY          optional; without it every rollout signs everybody
#                                    out, and sessions cannot span replicas
#
# Set allowedGroups unless the provider itself is the boundary. When it IS set and the
# provider sends no groups claim, nobody is admitted: deliberate and loud, rather than
# admitting everyone because a claim was missing.
auth:
  oidc:
    issuer: ""                # e.g. https://login.microsoftonline.com/<tenant-id>/v2.0
    clientID: ""
    redirectURL: ""           # must match a redirect URI on the app registration
    allowedGroups: []         # group object IDs or names, from the groups claim
    allowedEmails: []
    allowedDomains: []
    scopes: []                # default: openid, profile, email
    sessionTTL: ""            # default 12h
    # Where the secrets come from. Referenced, not inlined: a client secret in values is
    # readable by anyone who can read the HelmRelease, and lands in git the moment those
    # values are committed. Point these at whatever your secret store produces - the key
    # names are that store's, which is why each is a name/key pair.
    clientSecretRef:
      name: ""                # Secret holding the OIDC client secret
      key: clientSecret
    sessionKeyRef:
      name: ""                # Secret holding the cookie signing key
      key: sessionKey

support:
  source: ""                # "endoflife" or empty
  options: []               # e.g. ["base-url=https://endoflife.date/api"]

scan:
  # Scan each unique image for per-CVE fix availability (Trivy is bundled in the
  # image). Trivy pulls the images itself and downloads its vuln DB, so the job
  # needs egress to your registries and to ghcr.io/aquasecurity/trivy-db.
  # A per-image scan failure (e.g. a private image with no creds) is tolerated —
  # that finding is reported "unscanned", the run does not fail.
  enabled: false
  vulnSource: trivy
  # A source named after the provider inherits the provider's options, so the rapid7
  # vuln source already knows the base URL from provider.api.baseURL. Set these only to
  # point a source somewhere else.
  vulnOptions: []
  # Also annotate CVEs with EPSS + CISA KEV (needs egress to first.org + cisa.gov).
  # Comma-separated: "public" gives EPSS + KEV, "rapid7" adds the platform's own
  # risk score. They are not interchangeable — see docs/scanning.md.
  exploitSource: ""          # e.g. "public" or "public,rapid7"
  exploitOptions: []         # inherited from the provider for a same-named source

  # Trivy's vulnerability DB is several hundred MB and is downloaded on every pod
  # start. On an ephemeral volume that means every CronJob run pays for it.
  #
  # Persisting it is safe: the DB is immutable per version and Trivy keys its own
  # result cache on the DB version, so a cached result can never outlive the data
  # that produced it. Nothing else is cached here — tag listings and digests are
  # deliberately re-read, since detecting that they moved is the point.
  cache:
    persistence:
      # Off by default: the chart should not require storage to work. In server mode
      # the emptyDir already survives container restarts, so this buys the DB download
      # back across rescheduling, upgrades and node drains. In CronJob mode every run
      # starts a fresh pod, so it pays for itself immediately.
      enabled: false
      # Reuse a claim you manage yourself instead of letting the chart create one.
      existingClaim: ""
      size: 2Gi
      storageClass: ""
      # ReadWriteOnce is right for a single writer. There is only ever one — the
      # Deployment runs one replica, and the CronJob sets concurrencyPolicy: Forbid.
      accessMode: ReadWriteOnce

# Date CVEs from the scan provider's own first-seen times, so the queue has a time
# dimension. Requires scan.enabled: it stamps CVEs that already exist.
age:
  source: ""                 # e.g. "rapid7"
  options: []                # inherited from the provider for a same-named source

registryAuth:
  # Credentials for Trivy to pull PRIVATE images. Use your cloud's workload
  # identity (no secrets to manage) or mount a docker config Secret. Enable at
  # most one cloud identity. Trivy resolves the rest via its native keychains.
  azure:
    # AKS + ACR. Federate the ServiceAccount to a managed identity with AcrPull.
    # The SA gets the client-id annotation AND the pod gets the required
    # `azure.workload.identity/use: "true"` label. Needs the workload-identity
    # webhook and an OIDC-enabled cluster.
    workloadIdentity:
      enabled: false
      clientId: ""           # the managed identity's client id
      tenantId: ""           # optional
  gcp:
    # GKE + Artifact Registry / GCR. Bind this KSA to a Google service account
    # with reader access (Workload Identity).
    workloadIdentity:
      enabled: false
      serviceAccount: ""     # <gsa>@<project>.iam.gserviceaccount.com
  aws:
    # EKS + ECR (IRSA). The pod-identity webhook injects credentials from the
    # annotated role.
    irsa:
      enabled: false
      roleArn: ""            # arn:aws:iam::<account>:role/<role>
  # Any registry: mount a docker config json Secret (e.g. an existing
  # imagePullSecret). Its key is mounted as config.json; DOCKER_CONFIG points at it.
  dockerConfigSecret: ""
  dockerConfigKey: ".dockerconfigjson"

# Restrict what patchwright can reach. Off by default: the destinations depend on
# which registries, chart repositories and Jira instance you use, so a policy shipped
# blind would either be wrong or so broad as to be theatre. See SECURITY.md for the
# outbound connections and what enables each.
networkPolicy:
  enabled: false
  # Override with specific rules; the defaults are deliberately coarse (HTTPS out,
  # API port in) and documented as such in the template.
  ingress: []
  egress: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
